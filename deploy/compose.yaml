name: customer-fabric
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: fabric
      POSTGRES_DB: fabric
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make init}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fabric -d fabric']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [database]
  migrate:
    build:
      context: ../backend
    command: [migrate]
    environment: &api-env
      CF_MODE: development
      CF_DEV_TOKENS: ${CF_DEV_TOKENS:?Run make init}
      DATABASE_URL: postgres://fabric:${POSTGRES_PASSWORD}@db:5432/fabric?sslmode=disable
      CF_LISTEN: 0.0.0.0:8080
    depends_on:
      db: {condition: service_healthy}
    networks: [database]
  api:
    build:
      context: ../backend
    environment: *api-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ['127.0.0.1:8080:8080']
    networks: [database]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  admin:
    image: oven/bun:1.3.3
    working_dir: /app
    volumes:
      - ../web/admin:/app
    environment:
      API_URL: http://api:8080
    command: [sh, -c, "bun install --frozen-lockfile && bun run dev"]
    ports: ['127.0.0.1:5173:5173']
    depends_on: [api]
    networks: [database]
  go:
    build:
      context: ../backend
      dockerfile: Dockerfile.tools
    profiles: [tools]
    working_dir: /workspace/backend
    volumes:
      - ../backend:/workspace/backend
      - go-cache:/go
      - go-build:/root/.cache/go-build
    environment:
      TEST_DATABASE_URL: postgres://fabric:${POSTGRES_PASSWORD}@db:5432/fabric?sslmode=disable
    networks: [database]
  sqlc:
    image: sqlc/sqlc:1.31.1
    profiles: [tools]
    working_dir: /src
    volumes:
      - ../backend:/src
  bun:
    image: oven/bun:1.3.3
    profiles: [tools]
    working_dir: /workspace/web/admin
    volumes:
      - ../web/admin:/workspace/web/admin
    networks: [database]
volumes:
  postgres:
  go-cache:
  go-build:
networks:
  database:
