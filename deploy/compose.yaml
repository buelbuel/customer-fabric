name: customer-fabric
# The development stack: PostgreSQL, the API and console, separate customer and operator issuers (Kratos),
# Hydra for application tokens and a synthetic webhook sink. Kafka and Temporal are an opt-in overlay
# (compose.events.yaml). Synthetic data only.
x-operator-kratos: &operator-kratos
  image: oryd/kratos:v26.2.0-distroless@sha256:481bfc3022e5427ffb94570eef84480b99c9f8158388378c57df8c1a4a104b3d
  volumes:
    - ./operator-kratos:/etc/config/kratos:ro
x-operator-env: &operator-env
  DSN: postgres://operator_kratos:${CF_OPERATOR_POSTGRES_PASSWORD:?Run make up}@operator-db:5432/operator_kratos?sslmode=disable
  SQA_OPT_OUT: "1"

services:
  db:
    build: ./postgres
    environment:
      POSTGRES_USER: fabric_m1
      POSTGRES_DB: fabric_m1
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make init}
    volumes:
      - fabric-m1-postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U fabric_m1 -d fabric_m1']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [database]
  migrate:
    build:
      context: ../backend
    command: [migrate]
    environment: &api-env
      CF_MODE: development
      CF_DEV_TOKENS: ${CF_DEV_TOKENS:?Run make init}
      DATABASE_URL: postgres://fabric_m1:${POSTGRES_PASSWORD}@db:5432/fabric_m1?sslmode=disable
      CF_LISTEN: 0.0.0.0:8080
    depends_on:
      db: {condition: service_healthy}
    networks: [database]
  api:
    build:
      context: ../backend
    env_file:
      - path: ../.env.linking
        required: false
      # Seals webhook signing secrets (make up creates it). Without it, sealed secrets cannot sign.
      - path: ../.env.webhooks
        required: false
    environment:
      <<: *api-env
      CF_CUSTOMER_BROWSER_ORIGIN: ${CF_CUSTOMER_BROWSER_ORIGIN:-}
      CF_KRATOS_PUBLIC_URL: http://kratos:4433
      # Operators are named, with MFA and roles, at their own issuer (ADR 0008).
      CF_OPERATOR_KRATOS_PUBLIC_URL: http://operator-kratos:4433
      CF_OPERATOR_BROWSER_ORIGIN: ${CF_OPERATOR_BROWSER_ORIGIN:-}
      CF_WEBHOOK_ALLOWED_HOSTS: webhook-sink:8090
      # The local webhook sink is a container on a private network, over http: development only.
      CF_WEBHOOK_ALLOW_PRIVATE_NETWORKS: "true"
      CF_WEBHOOK_ALLOW_PLAINTEXT: "true"
      CF_HYDRA_ADMIN_URL: http://hydra:4445
      CF_HYDRA_PUBLIC_URL: http://hydra:4444
      CF_HYDRA_ISSUER: ${CF_CUSTOMER_BROWSER_ORIGIN:-http://127.0.0.1:4433}
    depends_on:
      migrate: {condition: service_completed_successfully}
      kratos: {condition: service_started}
      operator-kratos: {condition: service_started}
    ports: ['127.0.0.1:${CF_API_PORT:-8080}:8080']
    networks: [database, identity, operator-identity, webhooks]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  admin:
    image: oven/bun:1.4.4-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a
    working_dir: /app
    volumes:
      - ../web/admin:/app
    environment:
      API_URL: http://api:8080
    command: [sh, -c, "bun install --frozen-lockfile && bun run dev"]
    ports: ['127.0.0.1:${CF_ADMIN_PORT:-5173}:5173']
    depends_on: [api]
    networks: [database]
  admin-production:
    build:
      context: ../web/admin
    profiles: [production-ui]
    ports: ['127.0.0.1:${CF_PRODUCTION_UI_PORT:-5174}:8080']
    depends_on: [api]
    networks: [database]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  go:
    build:
      context: ../backend
      dockerfile: Dockerfile.tools
    profiles: [tools]
    working_dir: /workspace/backend
    volumes:
      - ../backend:/workspace/backend
      - ../tests:/workspace/tests
      - ../.tools:/workspace/.tools
      - go-cache:/go
      - go-build:/root/.cache/go-build
    environment:
      TEST_DATABASE_URL: postgres://fabric_m1:${POSTGRES_PASSWORD}@db:5432/fabric_m1?sslmode=disable
    networks: [database]
  contracts:
    image: oven/bun:1.4.4-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a
    profiles: [tools]
    working_dir: /workspace/tools/verification
    volumes:
      - ..:/workspace
    env_file:
      - path: ../.env.linking
        required: false
    environment:
      CF_CONTRACT_BASE_URL: http://api:8080
      CF_REQUIRE_LIVE_CONTRACTS: "1"
      CF_DEV_TOKENS: ${CF_DEV_TOKENS:?Run make init}
      CF_CONTRACT_KRATOS_URL: http://kratos:4433
      CF_CONTRACT_MAILPIT_URL: http://mailpit:8025
      CF_CONTRACT_BROWSER_ORIGIN: ${CF_CONTRACT_BROWSER_ORIGIN:-}
      CF_CONTRACT_DATABASE_URL: postgres://fabric_m1:${POSTGRES_PASSWORD:?Run make init}@db:5432/fabric_m1?sslmode=disable
      # A session of a synthetic operator holding every role; make contracts creates one per run.
      CF_CONTRACT_OPERATOR_SESSION: ${CF_CONTRACT_OPERATOR_SESSION:-}
    networks: [database, identity, identity-mail]
  sqlc:
    image: sqlc/sqlc:1.31.1
    profiles: [tools]
    working_dir: /src
    volumes:
      - ../backend:/src
  bun:
    image: oven/bun:1.4.4-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a
    profiles: [tools]
    working_dir: /workspace/web/admin
    volumes:
      - ../web/admin:/workspace/web/admin
    networks: [database]
  customer-reference:
    build:
      context: ../backend
      dockerfile: Dockerfile.reference
    environment:
      CF_MODE: development
      CF_REFERENCE_KRATOS: http://kratos:4433
      CF_REFERENCE_API: http://api:8080
      CF_REFERENCE_HYDRA_ADMIN: http://hydra:4445
      CF_REFERENCE_HYDRA_PUBLIC: http://hydra:4444
    ports: ['127.0.0.1:${CF_KRATOS_PORT:-4433}:8081']
    networks: [identity]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  kratos-db:
    build: ./postgres
    environment:
      POSTGRES_USER: kratos
      POSTGRES_DB: kratos
      POSTGRES_PASSWORD: ${CF_KRATOS_POSTGRES_PASSWORD:?Run make up}
    volumes:
      - kratos-postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U kratos -d kratos']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [identity-storage]
  kratos-migrate:
    image: oryd/kratos:v26.2.0-distroless@sha256:481bfc3022e5427ffb94570eef84480b99c9f8158388378c57df8c1a4a104b3d
    environment:
      DSN: postgres://kratos:${CF_KRATOS_POSTGRES_PASSWORD:?Run make up}@kratos-db:5432/kratos?sslmode=disable
      SQA_OPT_OUT: "1"
    command: [migrate, sql, --config, /etc/config/kratos/kratos.yaml, --yes, --read-from-env]
    volumes:
      - ./kratos:/etc/config/kratos:ro
    depends_on:
      kratos-db: {condition: service_healthy}
    networks: [identity-storage]
  kratos:
    image: oryd/kratos:v26.2.0-distroless@sha256:481bfc3022e5427ffb94570eef84480b99c9f8158388378c57df8c1a4a104b3d
    environment:
      DSN: postgres://kratos:${CF_KRATOS_POSTGRES_PASSWORD:?Run make up}@kratos-db:5432/kratos?sslmode=disable
      SERVE_PUBLIC_BASE_URL: ${CF_CUSTOMER_BROWSER_ORIGIN:-http://127.0.0.1:4433}/
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: ${CF_CUSTOMER_BROWSER_ORIGIN:-http://127.0.0.1:4433}/
      SELFSERVICE_FLOWS_ERROR_UI_URL: ${CF_CUSTOMER_BROWSER_ORIGIN:-http://127.0.0.1:4433}/account/error
      SELFSERVICE_FLOWS_REGISTRATION_UI_URL: ${CF_CUSTOMER_BROWSER_ORIGIN:-http://127.0.0.1:4433}/account/registration
      SELFSERVICE_FLOWS_LOGIN_UI_URL: ${CF_CUSTOMER_BROWSER_ORIGIN:-http://127.0.0.1:4433}/account/login
      SELFSERVICE_FLOWS_SETTINGS_UI_URL: ${CF_CUSTOMER_BROWSER_ORIGIN:-http://127.0.0.1:4433}/account/settings
      SELFSERVICE_FLOWS_VERIFICATION_UI_URL: ${CF_CUSTOMER_BROWSER_ORIGIN:-http://127.0.0.1:4433}/account/verification
      SELFSERVICE_FLOWS_RECOVERY_UI_URL: ${CF_CUSTOMER_BROWSER_ORIGIN:-http://127.0.0.1:4433}/account/recovery
      SESSION_COOKIE_NAME: cf_customer_${CF_CUSTOMER_BROWSER_PORT:-4433}
      # Kratos may return to the OAuth login bridge after a login started by an application.
      SELFSERVICE_ALLOWED_RETURN_URLS: ${CF_CUSTOMER_BROWSER_ORIGIN:-http://127.0.0.1:4433}/account/oauth/login
      SECRETS_COOKIE: ${CF_KRATOS_COOKIE_SECRET:?Run make up}
      SECRETS_CIPHER: ${CF_KRATOS_CIPHER_SECRET:?Run make up}
      SQA_OPT_OUT: "1"
    command: [serve, --config, /etc/config/kratos/kratos.yaml, --dev, --watch-courier, --sqa-opt-out]
    volumes:
      - ./kratos:/etc/config/kratos:ro
    depends_on:
      kratos-migrate: {condition: service_completed_successfully}
      mailpit: {condition: service_started}
    networks: [identity, identity-storage, identity-mail]
  hydra-db:
    build: ./postgres
    environment:
      POSTGRES_USER: hydra
      POSTGRES_DB: hydra
      POSTGRES_PASSWORD: ${CF_HYDRA_POSTGRES_PASSWORD:?Run make up}
    volumes:
      - hydra-postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U hydra -d hydra']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [oauth-storage]
  hydra-migrate:
    image: oryd/hydra:v26.2.0-distroless@sha256:ad53a123ddf869fc23ea74f3d76b47e2966dc52f559e93ab31f81440f4d60c5e
    environment:
      DSN: postgres://hydra:${CF_HYDRA_POSTGRES_PASSWORD:?Run make up}@hydra-db:5432/hydra?sslmode=disable
    command: [migrate, sql, up, --yes, --read-from-env]
    depends_on:
      hydra-db: {condition: service_healthy}
    networks: [oauth-storage]
  hydra:
    # OAuth 2.0 / OIDC provider (ADR 0012). Nothing is published: browsers reach its public endpoints
    # through the customer reference origin, which is also the issuer; the admin port stays on the
    # identity network for the API and the reference gateway.
    image: oryd/hydra:v26.2.0-distroless@sha256:ad53a123ddf869fc23ea74f3d76b47e2966dc52f559e93ab31f81440f4d60c5e
    environment:
      DSN: postgres://hydra:${CF_HYDRA_POSTGRES_PASSWORD:?Run make up}@hydra-db:5432/hydra?sslmode=disable
      SECRETS_SYSTEM: ${CF_HYDRA_SYSTEM_SECRET:?Run make up}
      URLS_SELF_ISSUER: ${CF_CUSTOMER_BROWSER_ORIGIN:-http://127.0.0.1:4433}
      URLS_SELF_PUBLIC: ${CF_CUSTOMER_BROWSER_ORIGIN:-http://127.0.0.1:4433}
      URLS_LOGIN: ${CF_CUSTOMER_BROWSER_ORIGIN:-http://127.0.0.1:4433}/account/oauth/login
      URLS_CONSENT: ${CF_CUSTOMER_BROWSER_ORIGIN:-http://127.0.0.1:4433}/account/oauth/consent
      URLS_LOGOUT: ${CF_CUSTOMER_BROWSER_ORIGIN:-http://127.0.0.1:4433}/account/oauth/logout
      URLS_ERROR: ${CF_CUSTOMER_BROWSER_ORIGIN:-http://127.0.0.1:4433}/account/error
      STRATEGIES_ACCESS_TOKEN: jwt
      OAUTH2_PKCE_ENFORCED_FOR_PUBLIC_CLIENTS: "true"
      OIDC_SUBJECT_IDENTIFIERS_SUPPORTED_TYPES: public
      SERVE_PUBLIC_PORT: "4444"
      SERVE_ADMIN_PORT: "4445"
      SQA_OPT_OUT: "1"
    command: [serve, all, --dev, --sqa-opt-out]
    depends_on:
      hydra-migrate: {condition: service_completed_successfully}
    networks: [identity, oauth-storage]
  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    ports: ['127.0.0.1:${CF_MAILPIT_PORT:-8025}:8025']
    networks: [identity-mail]
  webhook-sink:
    # Synthetic activation destination; holds received deliveries in memory only.
    image: oven/bun:1.4.4-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a
    working_dir: /sink
    command: [bun, sink.ts]
    volumes:
      - ../tools/webhook-sink:/sink:ro
    tmpfs: [/tmp]
    ports: ['127.0.0.1:${CF_WEBHOOK_SINK_PORT:-8090}:8090']
    networks: [webhooks]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  operator-db:
    build: ./postgres
    environment:
      POSTGRES_USER: operator_kratos
      POSTGRES_DB: operator_kratos
      POSTGRES_PASSWORD: ${CF_OPERATOR_POSTGRES_PASSWORD:?Run make up}
    volumes:
      - operator-postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U operator_kratos -d operator_kratos']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [operator-storage]
  operator-migrate:
    <<: *operator-kratos
    environment: *operator-env
    command: [migrate, sql, --config, /etc/config/kratos/kratos.yaml, --yes, --read-from-env]
    depends_on:
      operator-db: {condition: service_healthy}
    networks: [operator-storage]
  operator-kratos:
    <<: *operator-kratos
    environment:
      <<: *operator-env
      SECRETS_COOKIE: ${CF_OPERATOR_COOKIE_SECRET:?Run make up}
      SECRETS_CIPHER: ${CF_OPERATOR_CIPHER_SECRET:?Run make up}
      SERVE_PUBLIC_BASE_URL: ${CF_OPERATOR_BROWSER_ORIGIN:-http://127.0.0.1:4435}/
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: ${CF_OPERATOR_BROWSER_ORIGIN:-http://127.0.0.1:4435}/
      SELFSERVICE_FLOWS_ERROR_UI_URL: ${CF_OPERATOR_BROWSER_ORIGIN:-http://127.0.0.1:4435}/account/error
      SELFSERVICE_FLOWS_LOGIN_UI_URL: ${CF_OPERATOR_BROWSER_ORIGIN:-http://127.0.0.1:4435}/account/login
      SELFSERVICE_FLOWS_SETTINGS_UI_URL: ${CF_OPERATOR_BROWSER_ORIGIN:-http://127.0.0.1:4435}/account/settings
      SESSION_COOKIE_NAME: cf_operator_${CF_OPERATOR_BROWSER_PORT:-4435}
    command: [serve, --config, /etc/config/kratos/kratos.yaml, --dev, --sqa-opt-out]
    depends_on:
      operator-migrate: {condition: service_completed_successfully}
    networks: [operator-identity, operator-storage]
  operator-reference:
    build:
      context: ../backend
      dockerfile: Dockerfile.reference
    environment:
      CF_MODE: development
      CF_REFERENCE_OPERATOR: "1"
      CF_REFERENCE_KRATOS: http://operator-kratos:4433
      CF_REFERENCE_API: http://api:8080
    ports: ['127.0.0.1:${CF_OPERATOR_PORT:-4435}:8081']
    networks: [operator-identity]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  operator-admin-tool:
    # Reaches the operator issuer's admin API, which is never published.
    image: oven/bun:1.4.4-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a
    profiles: [tools]
    network_mode: service:operator-kratos
    volumes:
      - ../scripts/operator-admin-tool.js:/operator-admin-tool.js:ro
    command: [bun, /operator-admin-tool.js]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  database:
  operator-identity:
  operator-storage:
    internal: true
  oauth-storage:
    internal: true
  webhooks:
  identity:
  identity-storage:
    internal: true
  identity-mail:
volumes:
  fabric-m1-postgres:
  kratos-postgres:
  operator-postgres:
  hydra-postgres:
  go-cache:
  go-build:
