  /v1/operator/segments/{name}/snapshot-jobs:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}}
    post:
      operationId: submitSnapshotJob
      description: >-
        Queue a snapshot of the segment's current revision as a durable job, for populations too large to evaluate inside a request.
        The revision is pinned at submission and must be governed. A worker later decides every customer in one REPEATABLE READ
        transaction, with the same evaluator as the synchronous snapshot, and publishes the snapshot and completes the job in that
        transaction: membership reflects one database state, never a mix of moments, and nothing partial is stored. An attempt that
        fails or is interrupted publishes nothing and the job is evaluated again from the start under a new snapshot. 202 for a newly
        queued job, 200 when the Idempotency-Key already named it, 409 when the key belongs to a different job or the segment is no
        longer governed, 503 when 20 jobs are already waiting.
      security:
        - operatorBearer: []
        - operatorCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{16,128}$'}
          description: Names this submission. Repeating it returns the job it already queued.
      responses:
        '200':
          description: The job this key already queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AudienceJob'}
        '202':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AudienceJob'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '405': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/operator/segments/{name}/activation-jobs:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}}
    post:
      operationId: submitActivationJob
      description: >-
        Queue an activation of the segment's current revision for a registered destination as a durable job, evaluated as a snapshot
        job is. Completion queues one delivery per member in the same transaction. Queuing is not permission to send: the dispatcher
        re-checks the destination allowlist, governance, lifecycle, effective permission and criteria immediately before every
        attempt, so a withdrawal after submission or after completion suppresses the delivery. 422 for an unknown destination;
        otherwise as for snapshot jobs.
      security:
        - operatorBearer: []
        - operatorCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{16,128}$'}
          description: Names this submission. Repeating it returns the job it already queued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [destination]
              properties:
                destination: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
      responses:
        '200':
          description: The job this key already queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AudienceJob'}
        '202':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AudienceJob'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '405': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
