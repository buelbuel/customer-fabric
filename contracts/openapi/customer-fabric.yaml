  /v1/operator/segments/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
    get:
      operationId: listSegmentRevisions
      description: Every revision of one segment, oldest first.
      security:
        - operatorBearer: []
        - operatorCookie: []
      responses:
        '200':
          description: Revisions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SegmentList'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      operationId: defineSegment
      description: >-
        Append the next immutable revision of a typed segment rule. Rules are data, never SQL. Every condition must name a defined
        attribute whose current access policy grants the segmentation reader, use an operator its type supports and compare only
        literals the attribute's definition accepts (422 otherwise; the refusal names the condition position, never a value).
        purpose_id must be a registered consent purpose: only customers whose effective permission for it is permitted can be members.
        Without If-Match this defines a new segment; an existing segment without If-Match is 428, and a stale revision is 412.
        Refused for named operator sessions, because no operator write role exists yet.
      security:
        - operatorBearer: []
        - operatorCookie: []
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          description: Quoted current revision when revising. Omit to define a new segment.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SegmentRule'}
      responses:
        '201':
          description: The new revision
          headers:
            ETag:
              schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
              description: Quoted new revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Segment'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/operator/segments/{name}/preview:
    parameters:
      - name: name
        in: path
        required: true
        schema: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
    get:
      operationId: previewSegment
      description: >-
        Evaluate the segment's current revision over every customer anchor in one read-only snapshot, on each request; membership is
        never stored, so a consent withdrawal, revoked association or narrowed access policy changes the next preview. A customer is a
        member only if their segmentation view is available, their effective permission for the purpose is permitted and the rule
        matches; non-members are only counted, by the first gate they failed. Conditions see only values the segmentation reader is
        granted. The sample explains each member by the conditions that admitted it, by provenance and never by value.
        409 when a condition's attribute is no longer granted to segmentation (a narrowed policy would otherwise silently change what
        the segment selects), or when there are more than 1,000 customer anchors, rather than a partial count. Customer sessions and source credentials are refused.
      security:
        - operatorBearer: []
        - operatorCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
          description: Members in the sample.
        - name: cursor
          in: query
          required: false
          schema: {$ref: '#/components/schemas/ID'}
          description: next_cursor from the previous preview.
      responses:
        '200':
          description: The live preview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SegmentPreview'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '405': {$ref: '#/components/responses/Problem'}
