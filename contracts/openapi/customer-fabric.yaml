openapi: 3.1.0
info:
  title: Customer Fabric Development API
  version: 0.2.0
  description: >-
    Development API with separate customer, operator and integration credentials.
    In the M1 stack, integrations create and update profiles within their source scope.
    Operators read profiles. Verified customers access their own linked profile and consent choices.
servers:
  - url: http://127.0.0.1:8080
security:
  - sourceBearer: []
paths:
  /healthz:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Process liveness only; does not check database readiness.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {const: alive}
  /v1/profiles:
    get:
      operationId: listProfiles
      description: Legacy M0 development reads only. M1 integration credentials receive 403.
      parameters:
        - name: cursor
          in: query
          schema: {$ref: '#/components/schemas/ID'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Profile summaries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfilePage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createProfile
      description: >-
        Creates a profile. remove is forbidden. The credential determines the source.
        Requires at least one set attribute or identifier. Mutation and outbox commit atomically.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMutation'}
      responses:
        '201':
          description: Created, or exact replay of a previously successful creation
          headers:
            Location:
              schema: {type: string}
              description: Profile resource path
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Receipt'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/profiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ID'}
    get:
      operationId: getProfile
      description: Legacy M0 development reads only. M1 integration credentials receive 403.
      responses:
        '200':
          description: Consistent current profile and most recent 100 attribute decisions
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateProfile
      description: >-
        Explicit scalar set/remove and add-only identifiers. In M1, the integration
        credential may update only a profile originally created by that source.
        At most 100 combined set/remove operations, with disjoint keys, and 20 identifier
        additions per request. Profile limits are 100 live attributes and 100 identifiers.
        First writer owns each attribute, including removal tombstones. Ownership conflict
        rejects the entire request and records rejected attribute decisions. No array,
        nested object, ownership transfer, replacement, identifier removal or profile merge.
        Replay is checked before the current version, so an identical successful retry
        returns its original receipt even if the profile has since advanced. A set value for
        a defined attribute must match its current revision (see /v1/operator/attributes);
        otherwise the request is 422 and reserves no key.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - name: If-Match
          in: header
          required: true
          schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          description: Exact ETag from the latest successful mutation or an authorized read.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Mutation'}
      responses:
        '200':
          description: Applied or replayed mutation receipt
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Receipt'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/imports:
    post:
      operationId: createImport
      description: >-
        Start a resumable import of the credential's own historical records. Rows are sent in ordered NDJSON batches to
        /v1/imports/{id}/rows. max_errors (default 100) bounds quarantined rows; past it the import fails. With csv the import takes
        text/csv batches mapped by that column mapping; without it, NDJSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                max_errors: {type: integer, minimum: 0, maximum: 100000}
                csv: {$ref: '#/components/schemas/CSVMapping'}
      responses:
        '201':
          description: The open import
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Import'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /v1/imports/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/ID'}}
    get:
      operationId: getImport
      description: Progress and the first 1,000 quarantined lines, by line number and reason code. Another source's import is 404.
      responses:
        '200':
          description: Progress
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Import'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '405': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /v1/imports/{id}/rows:
    parameters:
      - {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/ID'}}
    post:
      operationId: importRows
      description: >-
        Apply up to 1,000 newline-delimited rows (each at most 64 KiB, body at most 8 MiB), starting at line Import-Offset, which must
        be the import's checkpoint + 1 (409 otherwise, naming the line to resume at). Each row is
        {"record":{"namespace","value"},"set":{…},"remove":[…]} for the credential's own record: an unknown record is created with
        that identifier, a known one is updated. Rows go through the same typed, ownership-checked write path as POST /v1/profiles,
        and each commits together with the checkpoint, so after any failure the client reads the checkpoint and resends from there.
        Nothing is applied twice and nothing is skipped. A row for a record that already received a source event is quarantined as
        newer_events_exist and never overwrites it. Refused rows are quarantined by line and reason code (invalid_json, invalid_row,
        invalid_attribute_value, identifier_conflict, ownership_conflict, profile_not_writable, profile_limit, not_found, newer_events_exist,
        write_refused); row content is never stored or echoed. Every line counts, so a blank line is quarantined as invalid_json. A line
        over 64 KiB or a body over 8 MiB ends the batch with 413 after the rows before it; a batch stops early once the error budget
        fails the import.
      parameters:
        - name: Import-Offset
          in: header
          required: true
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema: {type: string}
          text/csv:
            schema:
              type: string
              description: >-
                For a CSV import: a header row, then data rows; Import-Offset and line numbers count data rows, and blank lines are
                not rows. A row with a used cell that is not valid UTF-8 is quarantined as invalid_json. The whole body is read
                before any row is applied. A cell becomes the mapped attribute (empty sets nothing), encoded by the attribute's defined
                type; a row with the wrong number of fields is quarantined as invalid_row, and malformed CSV ends the batch with 400
                after the rows before it.
      responses:
        '200':
          description: Progress after the batch
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Import'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '405': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /v1/imports/{id}/complete:
    parameters:
      - {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/ID'}}
    post:
      operationId: completeImport
      description: Close an open import; later batches are 409.
      responses:
        '200':
          description: Final progress
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Import'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '405': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /v1/source-events:
    post:
      operationId: ingestSourceEvent
      description: >-
        Apply one change from the source the credential maps to. The event resolves that source's
        own record by namespace and value, and updates only the profile bound to it. It never follows a verified
        association to a customer anchor, and never matches on email or other attributes. An unknown record
        or another source's record is 404. Ordering uses (source_epoch, sequence) per record lifetime; occurred_at
        never orders anything. An event at or before the record's position is stale: it is receipted and changes
        nothing. An event that attempts another source's attribute is a conflict: nothing changes, rejected
        decisions are recorded and the position still advances. Profile, provenance, outbox, receipt and position
        commit together. Retrying an event ID returns its original receipt with 200, even after later events
        or an epoch change. Deletes and record creation are not supported; create records with POST /v1/profiles.
        A set value for a defined attribute must match the attribute's current revision. A mismatch is 422 and,
        like any invalid event, records nothing and leaves the position free, so the corrected event can use it.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourceEvent'}
      responses:
        '200':
          description: Retry of a decided event; its original receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceEventReceipt'}
        '201':
          description: Event decided and receipted. Read outcome for what happened.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceEventReceipt'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: Event ID reused for different content, source_epoch is not the source's current epoch, the profile's lifecycle state refuses source writes, or the record's profile has several identifiers and so has no single order. Nothing is recorded.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /v1/source-consent-decisions:
    post:
      operationId: reportSourceConsentDecision
      description: >-
        Record a consent decision the source the credential maps to collected about one of its own records (ADR 0015). The record
        resolves by namespace and value to its current lifetime, under the same lock as linking; another source's record is 404.
        A grant needs the source's current source_epoch (409 otherwise), an active consent authority for the purpose (403
        otherwise), one of the authority's collection methods, the notice reference the policy version records, the active version,
        a collection time between the version's creation and now (five minutes' tolerance) and after the subject's latest
        withdrawal, denial or objection for the purpose (409 otherwise), the source's receipt reference and the hex SHA-256 digest of
        the stored proof. Withdrawals, denials and objections are always recorded, under any epoch; they name the channel they came
        through and need no notice or digest. A grant is the source's attestation, not independently verified evidence; it counts
        as consent only while its authority is active and only for that record lifetime, and a linked customer's own choice decides
        for the customer. Precedence uses receipt time. Retrying a key for the same record returns the original receipt with 200;
        reusing it with different content is 409.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{16,128}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [record, policy_version_id, decision, collected_at, proof]
              properties:
                record:
                  type: object
                  additionalProperties: false
                  required: [namespace, value]
                  properties:
                    namespace: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
                    value: {type: string, minLength: 1, maxLength: 256}
                policy_version_id: {$ref: '#/components/schemas/ID'}
                decision: {type: string, enum: [grant, deny, withdraw, object]}
                collected_at: {type: string, format: date-time}
                source_epoch: {type: integer, minimum: 1, description: Required for a grant.}
                proof:
                  type: object
                  additionalProperties: false
                  required: [method, reference]
                  properties:
                    method:
                      type: string
                      enum: [double_opt_in, signed_form, recorded_web_form, recorded_call, unsubscribe_link, support_request, source_record_update]
                      description: A grant names one of the first four, a collection method; other decisions name the channel they came through.
                    reference: {type: string, minLength: 1, maxLength: 256}
                    notice_reference: {type: string, minLength: 1, maxLength: 256, description: Required for a grant.}
                    sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$', description: Required for a grant.}
      responses:
        '200':
          description: Idempotent replay, no new evidence
          content: {application/json: {schema: {$ref: '#/components/schemas/ConsentEvidenceCreated'}}}
        '201':
          description: Evidence recorded
          content: {application/json: {schema: {$ref: '#/components/schemas/ConsentEvidenceCreated'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/customer/profile/preferences:
    get:
      operationId: getOwnPreferences
      description: >-
        The session customer's own display name, preferred language (canonical BCP 47) and IANA time zone, with the current version
        (0 before any write) and the 50 most recent changes by field name, never values. The ETag carries the version once one exists
        and is absent before the first write, whose PUT omits If-Match. An application may call it with a Hydra access token for the
        customer that carries the profile.read scope (ADR 0012). These fields belong to the
        customer alone: they are not Kratos identity traits and never reach source-owned attributes.
      security:
        - customerSession: []
        - customerBrowserSession: []
        - applicationAccessToken: []
      responses:
        '200':
          description: Preferences. ETag carries the quoted version once one exists; it is absent before the first write.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerPreferences'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '405': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    put:
      operationId: setOwnPreferences
      description: >-
        Replace the session customer's preferences. A blank or absent field clears it. If-Match carries the version read: omit it only
        before the first write (428 otherwise), and a stale version is 412. An unchanged document keeps its version. Display names are at
        most 100 characters without control characters; languages are BCP 47 tags; time zones are IANA names (422 otherwise). Refused
        with 409 while the profile's lifecycle state does not accept changes. Cookie-authenticated writes require the configured Origin.
        An application may call it with an access token carrying profile.write; a token without it is 403 insufficient_scope.
      security:
        - customerSession: []
        - customerBrowserSession: []
        - applicationAccessToken: []
      parameters:
        - {name: If-Match, in: header, required: false, schema: {type: string, pattern: '^"[1-9][0-9]*"$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                display_name: {type: [string, 'null']}
                preferred_language: {type: [string, 'null']}
                timezone: {type: [string, 'null']}
      responses:
        '200':
          description: The preferences after the write. ETag carries the quoted version once one exists.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerPreferences'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '405': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/customer/profile:
    get:
      operationId: getOwnCustomerProfile
      description: Return the profile linked to the verified Kratos session subject. Returns 404 until provisioning.
      security:
        - customerSession: []
        - customerBrowserSession: []
      responses:
        '200': {$ref: '#/components/responses/CustomerProfile'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    put:
      operationId: provisionOwnCustomerProfile
      description: >-
        Provision a dedicated blank profile for the verified Kratos subject, or return
        its existing linked profile. Accepts no body, query or target identifier.
        Cookie-authenticated provisioning requires the exact configured browser Origin.
      security:
        - customerSession: []
        - customerBrowserSession: []
      responses:
        '200': {$ref: '#/components/responses/CustomerProfile'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/linking/grants:
    post:
      operationId: issueLinkingGrant
      description: >-
        Synthetic trusted authority only. The dedicated issuer credential determines
        the source. Submit a claim only after an independent proof for this
        source account and authenticated Kratos subject has passed. Proof
        references are one-time within a source. Grant secrets are returned
        once and expire after ten minutes. A matching email or record ID is
        insufficient proof.
      security:
        - linkingIssuerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LinkingAttestation'}
      responses:
        '201':
          description: One-time grant issued
          headers:
            Location:
              schema: {type: string}
              description: Issuer grant resource path. It contains no grant secret.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuedLinkingGrant'}
        '409':
          description: The proof has already been used, or the source record already has a verified association.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /v1/linking/grants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ID'}
    delete:
      operationId: revokeLinkingGrant
      description: Cancel a pending grant or revoke its resulting association. Only its issuing source may act. Repeating the request succeeds.
      security:
        - linkingIssuerBearer: []
      responses:
        '204':
          description: Grant revoked or already revoked
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /v1/customer/associations:
    get:
      operationId: listOwnAssociations
      description: List active associations for the current verified Kratos subject, ordered by UUID.
      security:
        - customerSession: []
        - customerBrowserSession: []
      parameters:
        - name: cursor
          in: query
          schema: {$ref: '#/components/schemas/ID'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Association metadata only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssociationPage'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      operationId: redeemLinkingGrant
      description: >-
        Redeem a one-time grant for the session's verified subject. Provision a
        dedicated profile first. This operation creates a separate association
        and does not disclose or change the source-owned profile.
      security:
        - customerSession: []
        - customerBrowserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [grant]
              properties:
                grant: {$ref: '#/components/schemas/LinkingGrantSecret'}
      responses:
        '201':
          description: Grant consumed and verified association committed
          headers:
            Location:
              schema: {type: string}
              description: Association resource path
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VerifiedAssociation'}
        '409':
          description: Grant unavailable or profile provisioning required. Invalid, expired, revoked, replayed and other-subject grants receive the same grant problem.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/customer/associations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ID'}
    get:
      operationId: getOwnAssociation
      description: Return permitted metadata for an active association owned by the current subject.
      security:
        - customerSession: []
        - customerBrowserSession: []
      responses:
        '200':
          description: Association metadata only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VerifiedAssociation'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: unlinkOwnAssociation
      description: Revoke this subject's association and preserve its restricted history. Repeating the request succeeds.
      security:
        - customerSession: []
        - customerBrowserSession: []
      responses:
        '204':
          description: Association unlinked or already revoked
