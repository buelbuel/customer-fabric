    parameters:
      - {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/ID'}}
    get:
      operationId: getProcessingRestriction
      description: >-
        Whether processing of this profile is restricted, and its latest restriction decisions (at most 100, newest first) with reason
        codes, review dates and the deciding operator.
      security:
        - operatorBearer: []
        - operatorCookie: []
      responses:
        '200':
          description: The profile's restriction and its decisions, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Restriction'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '405': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      operationId: decideProcessingRestriction
      description: >-
        Restrict processing of a profile (GDPR Art. 18) or lift a restriction. Needs the privacy_admin role. A restriction names an
        Art. 18(1) ground (accuracy_contested, unlawful_processing, legal_claims, objection_pending) and a review_by date after today
        and at most a year ahead; lifting names why it ended (accuracy_verified, claim_resolved, objection_decided,
        restriction_withdrawn). The profile's restricted flag and the append-only decision change in one transaction. While
        restricted, the profile accepts no source writes and takes no part in customer views, segments, activations, matching or
        workflow notifications. Restricting a customer's anchor profile also withholds the customer's unified view, so segments,
        snapshots, audience jobs and activation dispatch exclude them, and blocks their applications' access and preference edits.
        Operators with profile_reader can still read the profile, and consent withdrawals and other customer decisions are still
        accepted. Needs profile_reader as well as privacy_admin. Restricting a restricted profile or lifting an unrestricted one is 409, as is changing the restriction
        of a profile that is not active; an erasure fence is never loosened. Decisions are not yet journaled outside the recovery
        domain (ADR 0009 section 6).
      security:
        - operatorBearer: []
        - operatorCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, reason]
              properties:
                action: {type: string, enum: [restrict, lift]}
                reason: {type: string, enum: [accuracy_contested, unlawful_processing, legal_claims, objection_pending, accuracy_verified, claim_resolved, objection_decided, restriction_withdrawn]}
                review_by: {type: string, format: date}
      responses:
        '200':
          description: The profile's restriction and its decisions, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Restriction'}
