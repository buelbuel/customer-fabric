    post:
      operationId: createDestination
      description: >-
        Register an immutable test webhook. The URL must be http or https with an explicit port on a host:port listed in
        CF_WEBHOOK_ALLOWED_HOSTS, without credentials, query or fragment (422 otherwise); the allowlist is checked again before every
        send and redirects are never followed. The response is the only place the 32-byte HMAC signing secret appears. Each delivery is
