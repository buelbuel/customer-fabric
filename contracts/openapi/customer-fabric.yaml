    get:
      operationId: listAttributeRevisions
      description: Every revision of one attribute, oldest first.
      security:
        - operatorBearer: []
        - operatorCookie: []
      responses:
        '200':
          description: Revisions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttributeDefinitionList'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      operationId: defineAttribute
      description: >-
        Append the next immutable revision. Without If-Match this defines a new attribute, which is refused with
        409 if any stored value does not conform (the count is reported, never the values) or if more than 10,000
        profiles hold one. An existing attribute without If-Match is 428; with it, the request revises the quoted current revision (412 if stale): the type is fixed, a string may only
        raise or drop max_length and an enum may only add values, so no accepted value is ever invalidated. An
        incompatible change needs a new attribute name. Definition changes wait for in-flight writes, and writes
        validate against the revision current when they commit. Refused for named operator sessions, because no
        operator write role exists yet.
      security:
        - operatorBearer: []
        - operatorCookie: []
      parameters:
        - name: If-Match
          in: header
          required: false
