openapi: 3.1.0
info:
  title: Customer Fabric Development API
  version: 0.2.0
  description: >-
    Development API with separate customer, operator and integration credentials.
    In the M1 stack, integrations create and update profiles within their source scope.
    Operators read profiles. Verified customers access their own linked profile and consent choices.
servers:
  - url: http://127.0.0.1:8080
security:
  - sourceBearer: []
paths:
  /healthz:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Process liveness only; does not check database readiness.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {const: alive}
  /v1/profiles:
    get:
      operationId: listProfiles
      description: Legacy M0 development reads only. M1 integration credentials receive 403.
      parameters:
        - name: cursor
          in: query
          schema: {$ref: '#/components/schemas/ID'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Profile summaries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfilePage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createProfile
      description: >-
        Creates a profile. remove is forbidden. The credential determines the source.
        Requires at least one set attribute or identifier. Mutation and outbox commit atomically.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMutation'}
      responses:
        '201':
          description: Created, or exact replay of a previously successful creation
          headers:
            Location:
              schema: {type: string}
              description: Profile resource path
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Receipt'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/profiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ID'}
    get:
      operationId: getProfile
      description: Legacy M0 development reads only. M1 integration credentials receive 403.
      responses:
        '200':
          description: Consistent current profile and most recent 100 attribute decisions
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateProfile
      description: >-
        Explicit scalar set/remove and add-only identifiers. In M1, the integration
        credential may update only a profile originally created by that source.
        At most 100 combined set/remove operations, with disjoint keys, and 20 identifier
        additions per request. Profile limits are 100 live attributes and 100 identifiers.
        First writer owns each attribute, including removal tombstones. Ownership conflict
        rejects the entire request and records rejected attribute decisions. No array,
        nested object, ownership transfer, replacement, identifier removal or profile merge.
        Replay is checked before the current version, so an identical successful retry
        returns its original receipt even if the profile has since advanced. A set value for
        a defined attribute must match its current revision (see /v1/operator/attributes);
        otherwise the request is 422 and reserves no key.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - name: If-Match
          in: header
          required: true
          schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          description: Exact ETag from the latest successful mutation or an authorized read.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Mutation'}
      responses:
        '200':
          description: Applied or replayed mutation receipt
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Receipt'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/source-events:
    post:
      operationId: ingestSourceEvent
      description: >-
        Apply one change from the source the credential maps to. The event resolves that source's
        own record by namespace and value, and updates only the profile bound to it. It never follows a verified
        association to a customer anchor, and never matches on email or other attributes. An unknown record
        or another source's record is 404. Ordering uses (source_epoch, sequence) per record lifetime; occurred_at
        never orders anything. An event at or before the record's position is stale: it is receipted and changes
        nothing. An event that attempts another source's attribute is a conflict: nothing changes, rejected
        decisions are recorded and the position still advances. Profile, provenance, outbox, receipt and position
        commit together. Retrying an event ID returns its original receipt with 200, even after later events
        or an epoch change. Deletes and record creation are not supported; create records with POST /v1/profiles.
        A set value for a defined attribute must match the attribute's current revision. A mismatch is 422 and,
        like any invalid event, records nothing and leaves the position free, so the corrected event can use it.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourceEvent'}
      responses:
        '200':
          description: Retry of a decided event; its original receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceEventReceipt'}
        '201':
          description: Event decided and receipted. Read outcome for what happened.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceEventReceipt'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: Event ID reused for different content, source_epoch is not the source's current epoch, the profile's lifecycle state refuses source writes, or the record's profile has several identifiers and so has no single order. Nothing is recorded.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /v1/customer/profile:
    get:
      operationId: getOwnCustomerProfile
      description: Return the profile linked to the verified Kratos session subject. Returns 404 until provisioning.
      security:
        - customerSession: []
        - customerBrowserSession: []
      responses:
        '200': {$ref: '#/components/responses/CustomerProfile'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    put:
      operationId: provisionOwnCustomerProfile
      description: >-
        Provision a dedicated blank profile for the verified Kratos subject, or return
        its existing linked profile. Accepts no body, query or target identifier.
        Cookie-authenticated provisioning requires the exact configured browser Origin.
      security:
        - customerSession: []
        - customerBrowserSession: []
      responses:
        '200': {$ref: '#/components/responses/CustomerProfile'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/linking/grants:
    post:
      operationId: issueLinkingGrant
      description: >-
        Synthetic trusted authority only. The dedicated issuer credential determines
        the source. Submit a claim only after an independent proof for this
        source account and authenticated Kratos subject has passed. Proof
        references are one-time within a source. Grant secrets are returned
        once and expire after ten minutes. A matching email or record ID is
        insufficient proof.
      security:
        - linkingIssuerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LinkingAttestation'}
      responses:
        '201':
          description: One-time grant issued
          headers:
            Location:
              schema: {type: string}
              description: Issuer grant resource path. It contains no grant secret.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuedLinkingGrant'}
        '409':
          description: The proof has already been used, or the source record already has a verified association.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /v1/linking/grants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ID'}
    delete:
      operationId: revokeLinkingGrant
      description: Cancel a pending grant or revoke its resulting association. Only its issuing source may act. Repeating the request succeeds.
      security:
        - linkingIssuerBearer: []
      responses:
        '204':
          description: Grant revoked or already revoked
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /v1/customer/associations:
    get:
      operationId: listOwnAssociations
      description: List active associations for the current verified Kratos subject, ordered by UUID.
      security:
        - customerSession: []
        - customerBrowserSession: []
      parameters:
        - name: cursor
          in: query
          schema: {$ref: '#/components/schemas/ID'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Association metadata only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssociationPage'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      operationId: redeemLinkingGrant
      description: >-
        Redeem a one-time grant for the session's verified subject. Provision a
        dedicated profile first. This operation creates a separate association
        and does not disclose or change the source-owned profile.
      security:
        - customerSession: []
        - customerBrowserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [grant]
              properties:
                grant: {$ref: '#/components/schemas/LinkingGrantSecret'}
      responses:
        '201':
          description: Grant consumed and verified association committed
          headers:
            Location:
              schema: {type: string}
              description: Association resource path
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VerifiedAssociation'}
        '409':
          description: Grant unavailable or profile provisioning required. Invalid, expired, revoked, replayed and other-subject grants receive the same grant problem.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/customer/associations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ID'}
    get:
      operationId: getOwnAssociation
      description: Return permitted metadata for an active association owned by the current subject.
      security:
        - customerSession: []
        - customerBrowserSession: []
      responses:
        '200':
          description: Association metadata only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VerifiedAssociation'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: unlinkOwnAssociation
      description: Revoke this subject's association and preserve its restricted history. Repeating the request succeeds.
      security:
        - customerSession: []
        - customerBrowserSession: []
      responses:
        '204':
          description: Association unlinked or already revoked
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/customer/consent:
    get:
      operationId: listOwnConsent
      description: >-
        Current state for every purpose with an active policy version, plus any purpose whose retired
        version this customer decided under. Each item carries the policy version and the plain-text
        explanation shown for it, the effective evaluation and the revision a grant must quote.
        The session determines the subject. Ordered by purpose UUID.
      security:
        - customerSession: []
        - customerBrowserSession: []
      parameters:
        - name: cursor
          in: query
          schema: {$ref: '#/components/schemas/ID'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: The customer's own consent state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerConsentPage'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/customer/consent/history:
    get:
      operationId: listOwnConsentHistory
      description: >-
        The customer's own append-only decisions, newest first by database receipt time, including
        decisions an operator recorded about them. Proof references and source names are not disclosed.
      security:
        - customerSession: []
        - customerBrowserSession: []
      parameters:
        - name: cursor
          in: query
          schema: {$ref: '#/components/schemas/ID'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Audited decisions for the session's subject
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerConsentHistoryPage'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/customer/consent/decisions:
    post:
      operationId: recordOwnConsentDecision
      description: >-
        Append a grant or withdrawal as the authenticated customer, for a policy version resting on
        consent. The server sets the actor, channel, proof and time. A grant needs the active version
        and the purpose's current revision in If-Match, so a stale view cannot undo a newer decision.
        A withdrawal is also accepted on a retired version and is never refused as stale, and If-Match
        is ignored for it. Retrying with the same Idempotency-Key returns the original receipt, even
        after the revision has moved on. Objections are not offered, because this release has no way
        for a customer to lift one. Cookie-authenticated requests need the exact browser Origin.
      security:
        - customerSession: []
        - customerBrowserSession: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{8,128}$'}
          description: Unique per customer. Reusing a key for a different decision returns 409.
        - name: If-Match
          in: header
          schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          description: Quoted revision from the current state. Required for a grant.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerConsentDecision'}
      responses:
        '200':
          description: Idempotent replay, no new evidence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsentEvidenceCreated'}
        '201':
          description: Decision recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsentEvidenceCreated'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/operator/sources/{source}/epoch:
    parameters:
      - name: source
        in: path
        required: true
        schema: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
    get:
      operationId: getSourceEpoch
      description: Read a source's current epoch.
      security:
        - operatorBearer: []
        - operatorCookie: []
      responses:
        '200':
          description: The source's current epoch
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceEpoch'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      operationId: advanceSourceEpoch
      description: >-
        Move a source on from the epoch in If-Match, for example after a connector reset. A retry after a lost
        response gets 412 and cannot advance it twice. The epoch survives credential rotation. It waits for
        in-flight events, then events from the old epoch are refused and each record's ordering restarts under
        the new one. Refused for named operator sessions, because no operator write role exists yet.
      security:
        - operatorBearer: []
        - operatorCookie: []
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          description: Quoted current epoch, from the read operation.
      responses:
        '200':
          description: The source's new epoch
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceEpoch'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/operator/attributes:
    get:
      operationId: listAttributeDefinitions
      description: The current revision of every defined attribute, by path. Undefined attributes stay untyped scalars.
      security:
        - operatorBearer: []
        - operatorCookie: []
      responses:
        '200':
          description: Current definitions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttributeDefinitionList'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/operator/attributes/{path}:
    parameters:
      - name: path
        in: path
        required: true
        schema: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
    get:
      operationId: listAttributeRevisions
      description: Every revision of one attribute, oldest first.
      security:
        - operatorBearer: []
        - operatorCookie: []
      responses:
        '200':
          description: Revisions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttributeDefinitionList'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      operationId: defineAttribute
      description: >-
        Append the next immutable revision. Without If-Match this defines a new attribute, which is refused with
        409 if any stored value does not conform (the count is reported, never the values) or if more than 10,000
        profiles hold one. An existing attribute without If-Match is 428; with it, the request revises the quoted current revision (412 if stale): the type is fixed, a string may only
        raise or drop max_length and an enum may only add values, so no accepted value is ever invalidated. An
        incompatible change needs a new attribute name. Definition changes wait for in-flight writes, and writes
        validate against the revision current when they commit. Refused for named operator sessions, because no
        operator write role exists yet.
      security:
        - operatorBearer: []
        - operatorCookie: []
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          description: Quoted current revision when revising. Omit to define a new attribute.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttributeDefinitionRequest'}
      responses:
        '201':
          description: The new revision
          headers:
            ETag:
              schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
              description: Quoted new revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttributeDefinition'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/operator/attributes/{path}/access:
    parameters:
      - name: path
        in: path
        required: true
        schema: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
    get:
      operationId: listAccessPolicyRevisions
      description: Every access policy revision of a defined attribute, oldest first. The last is current; an empty list means nothing may read it.
      security:
        - operatorBearer: []
        - operatorCookie: []
      responses:
        '200':
          description: Revisions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessPolicyList'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      operationId: setAccessPolicy
      description: >-
        Append the next access policy revision for a defined attribute: which readers may see it, and from which owning sources. Access is
        denied by default and an undefined attribute cannot be given a policy (404). Unlike a definition, a revision may narrow access;
        empty lists withdraw it. Ownership and provenance are unaffected. Without If-Match this creates the first revision (428 if one
        exists); with it, the request replaces the quoted current revision (412 if stale). Refused for named operator sessions, because no
        operator write role exists yet.
      security:
        - operatorBearer: []
        - operatorCookie: []
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          description: Quoted current policy revision when replacing one.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccessPolicyRequest'}
      responses:
        '201':
          description: The new revision
          headers:
            ETag:
              schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
              description: Quoted new revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessPolicy'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/operator/profiles:
    get:
      operationId: listOperatorProfiles
