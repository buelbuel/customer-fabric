  /v1/operator/segments/{name}/preview:
    parameters:
      - name: name
        in: path
        required: true
        schema: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
    get:
      operationId: previewSegment
      description: >-
        Evaluate the segment's current revision over every customer anchor in one read-only snapshot, on each request; membership is
        never stored, so a consent withdrawal, revoked association or narrowed access policy changes the next preview. A customer is a
        member only if their segmentation view is available, their effective permission for the purpose is permitted and the rule
        matches; non-members are only counted, by the first gate they failed. Conditions see only values the segmentation reader is
        granted. The sample explains each member by the conditions that admitted it, by provenance and never by value.
        The population is not capped: customers are evaluated in set-based chunks, and only the sample is paged. Evaluations are bounded
        in time (10 s by default) and in concurrency; one that takes longer, or arrives while the limit is reached, is refused with 503
        rather than returned partial. 409 when a condition's attribute is no longer granted to segmentation (a narrowed policy would
        otherwise silently change what the segment selects). Customer sessions and source credentials are refused.
      security:
        - operatorBearer: []
        - operatorCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
          description: Members in the sample.
        - name: cursor
          in: query
          required: false
          schema: {$ref: '#/components/schemas/ID'}
          description: next_cursor from the previous preview.
      responses:
        '200':
          description: The live preview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SegmentPreview'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '405': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/operator/segments/{name}/activations:
    parameters:
      - name: name
        in: path
        required: true
        schema: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
    post:
      operationId: activateSegment
      description: >-
        Evaluate the segment's current revision exactly as a preview does and, in the same transaction, queue one delivery per member
        for a registered destination. Queuing is not permission to send: immediately before each attempt the dispatcher re-checks the
        destination allowlist, segment governance, the customer's lifecycle and view, effective permission for the purpose and the
        segment criteria, and suppresses the delivery if any gate fails. A delivery carries only attributes whose access policy grants
        the activation reader. The population is not capped; 503 as for previews. 404 for an unknown segment, 422 for an unknown
        destination, 409 when the segment is no longer governed. Refused for named operator sessions, because no operator write role exists yet.
      security:
        - operatorBearer: []
        - operatorCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [destination]
              properties:
                destination: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
      responses:
        '201':
          description: Members queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivationSummary'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '405': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
