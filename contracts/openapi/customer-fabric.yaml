    post:
      operationId: advanceSourceEpoch
      description: >-
        Move a source on from the epoch in If-Match, for example after a connector reset. A retry after a lost
        response gets 412 and cannot advance it twice. The epoch survives credential rotation. It waits for
        in-flight events, then events from the old epoch are refused and each record's ordering restarts under
        the new one. Refused for named operator sessions, because no operator write role exists yet.
      security:
