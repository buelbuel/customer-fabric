  /v1/operator/customers/{id}/unified-view:
    parameters:
      - name: id
        in: path
        required: true
        description: The customer anchor profile.
        schema: {$ref: '#/components/schemas/ID'}
    get:
      operationId: getCustomerUnifiedView
      description: >-
        Read-only view of the customer's verified source records, computed on each request in one snapshot. It selects no winner: every
        disclosed value is listed with its provenance and disagreement is reported as a conflict. A value is disclosed only if its
        attribute is defined, its current access policy names the operator reader and the record's source, the record's source owns it
        and an accepted write by that source exists. Undefined attributes are never disclosed. Policy changes apply to the next read. Revoked links and deleted or
        re-created identifiers are absent. Customer sessions and source credentials are refused. 404 when the profile is not a customer
        anchor; 409 when the customer's lifecycle state is not active, or when the customer has more than 50 linked records, rather than returning a partial view.
      security:
        - operatorBearer: []
        - operatorCookie: []
      responses:
        '200':
          description: The customer view. Empty lists when the customer has no active verified record.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerUnifiedView'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '405': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
