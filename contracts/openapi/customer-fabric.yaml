    parameters:
      - {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/ID'}}
    get:
      operationId: listMatchCandidates
      description: >-
        Other active source records that may be the same person as this source record, compared in one read-only snapshot. A
        candidate is a proposal for review: nothing is linked, merged or authorized. Only values of email, phone, given_name,
        family_name and customer_reference whose access policy grants the matching reader for the owning source take part. Email, phone
        or a reference alone never makes a candidate; a shared identifier with different given names is conflicting. Each candidate
        names the signals that agree and disagree, never their values. Candidates are ordered strong, probable, conflicting and
        limited to 100 (total counts all). The population is not capped: the lookup scans its snapshot for records sharing an email,
        phone or reference with the target's governed values (every candidate shares one) and compares only those. Nothing derived
        from the values is stored, so there is no matching index to keep in step with restriction, erasure or policy changes; each
        lookup decides from committed state and current policies. 404 unless the profile is an active source record; 503 when the
        lookup exceeds its time limit or the evaluation limit is reached.
      security:
        - operatorBearer: []
        - operatorCookie: []
      responses:
        '200':
          description: Candidates
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [profile_id, source, logic, population, total, candidates]
                properties:
                  profile_id: {$ref: '#/components/schemas/ID'}
                  source: {type: string}
                  logic: {type: string}
                  population: {type: integer, minimum: 0}
                  total: {type: integer, minimum: 0}
                  candidates:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required: [profile_id, source, class, agree, disagree]
                      properties:
                        profile_id: {$ref: '#/components/schemas/ID'}
                        source: {type: string}
                        class: {type: string, enum: [strong, probable, conflicting]}
                        agree: {type: array, items: {type: string}}
                        disagree: {type: array, items: {type: string}}
                        review: {type: string, enum: [same_person, different_people], description: The latest operator decision about this pair.}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '405': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
