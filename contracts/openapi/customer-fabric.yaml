openapi: 3.1.0
info:
  title: Customer Fabric Development API
  version: 0.2.0
  description: >-
    Development API with separate customer, operator and integration credentials.
    In the M1 stack, integrations create and update profiles within their source scope.
    Operators read profiles. Verified customers access their own linked profile.
servers:
  - url: http://127.0.0.1:8080
security:
  - sourceBearer: []
paths:
  /healthz:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Process liveness only; does not check database readiness.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {const: alive}
  /v1/profiles:
    get:
      operationId: listProfiles
      description: Legacy M0 development reads only. M1 integration credentials receive 403.
      parameters:
        - name: cursor
          in: query
          schema: {$ref: '#/components/schemas/ID'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Profile summaries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfilePage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createProfile
      description: >-
        Creates a profile. remove is forbidden. The credential determines the source.
        Requires at least one set attribute or identifier. Mutation and outbox commit atomically.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMutation'}
      responses:
        '201':
          description: Created, or exact replay of a previously successful creation
          headers:
            Location:
              schema: {type: string}
              description: Profile resource path
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Receipt'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/profiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ID'}
    get:
      operationId: getProfile
      description: Legacy M0 development reads only. M1 integration credentials receive 403.
      responses:
        '200':
          description: Consistent current profile and most recent 100 attribute decisions
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateProfile
      description: >-
        Explicit scalar set/remove and add-only identifiers. In M1, the integration
        credential may update only a profile originally created by that source.
        At most 100 combined set/remove operations, with disjoint keys, and 20 identifier
        additions per request. Profile limits are 100 live attributes and 100 identifiers.
        First writer owns each attribute, including removal tombstones. Ownership conflict
        rejects the entire request and records rejected attribute decisions. No array,
        nested object, ownership transfer, replacement, identifier removal or profile merge.
        Replay is checked before the current version, so an identical successful retry
        returns its original receipt even if the profile has since advanced.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - name: If-Match
          in: header
          required: true
          schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          description: Exact ETag from the latest successful mutation or an authorized read.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Mutation'}
      responses:
        '200':
          description: Applied or replayed mutation receipt
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Receipt'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/customer/profile:
    get:
      operationId: getOwnCustomerProfile
      description: Return the profile linked to the verified Kratos session subject. Returns 404 until provisioning.
      security:
        - customerSession: []
        - customerBrowserSession: []
      responses:
        '200': {$ref: '#/components/responses/CustomerProfile'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: provisionOwnCustomerProfile
      description: >-
        Provision a dedicated blank profile for the verified Kratos subject, or return
        its existing linked profile. Accepts no body, query or target identifier.
        Cookie-authenticated provisioning requires the exact configured browser Origin.
      security:
        - customerSession: []
        - customerBrowserSession: []
      responses:
        '200': {$ref: '#/components/responses/CustomerProfile'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/linking/grants:
    post:
      operationId: issueLinkingGrant
      description: >-
        Synthetic trusted authority only. The dedicated issuer credential determines
        the source. Submit a claim only after an independent proof for this
        source account and authenticated Kratos subject has passed. Proof
        references are one-time within a source. Grant secrets are returned
        once and expire after ten minutes. A matching email or record ID is
        insufficient proof.
      security:
        - linkingIssuerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LinkingAttestation'}
      responses:
        '201':
          description: One-time grant issued
          headers:
            Location:
              schema: {type: string}
              description: Issuer grant resource path. It contains no grant secret.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuedLinkingGrant'}
        '409':
          description: The proof has already been used, or the source record already has a verified association.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/linking/grants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ID'}
    delete:
      operationId: revokeLinkingGrant
      description: Cancel a pending grant or revoke its resulting association. Only its issuing source may act. Repeating the request succeeds.
      security:
        - linkingIssuerBearer: []
      responses:
        '204':
          description: Grant revoked or already revoked
        default: {$ref: '#/components/responses/Problem'}
  /v1/customer/associations:
    get:
      operationId: listOwnAssociations
      description: List active associations for the current verified Kratos subject, ordered by UUID.
      security:
        - customerSession: []
        - customerBrowserSession: []
      parameters:
        - name: cursor
          in: query
          schema: {$ref: '#/components/schemas/ID'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Association metadata only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssociationPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: redeemLinkingGrant
      description: >-
        Redeem a one-time grant for the session's verified subject. Provision a
        dedicated profile first. This operation creates a separate association
        and does not disclose or change the source-owned profile.
      security:
        - customerSession: []
        - customerBrowserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [grant]
              properties:
                grant: {$ref: '#/components/schemas/LinkingGrantSecret'}
      responses:
        '201':
          description: Grant consumed and verified association committed
          headers:
            Location:
              schema: {type: string}
              description: Association resource path
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VerifiedAssociation'}
        '409':
          description: Grant unavailable or profile provisioning required. Invalid, expired, revoked, replayed and other-subject grants receive the same grant problem.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/customer/associations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ID'}
    get:
      operationId: getOwnAssociation
      description: Return permitted metadata for an active association owned by the current subject.
      security:
        - customerSession: []
        - customerBrowserSession: []
      responses:
        '200':
          description: Association metadata only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VerifiedAssociation'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: unlinkOwnAssociation
      description: Revoke this subject's association and preserve its restricted history. Repeating the request succeeds.
      security:
        - customerSession: []
        - customerBrowserSession: []
      responses:
        '204':
          description: Association unlinked or already revoked
        default: {$ref: '#/components/responses/Problem'}
  /v1/operator/profiles:
    get:
      operationId: listOperatorProfiles
      description: Read-only operator access with UUID-ordered pagination.
      security:
        - operatorBearer: []
        - operatorCookie: []
      parameters:
        - name: cursor
          in: query
          schema: {$ref: '#/components/schemas/ID'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Profile summaries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfilePage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/operator/profiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ID'}
    get:
      operationId: getOperatorProfile
      security:
        - operatorBearer: []
        - operatorCookie: []
      responses:
        '200':
          description: Current profile with its identifiers and recent attribute decisions
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/operator/consent/purposes:
    post:
      operationId: createConsentPurpose
      description: Register a stable consent-purpose identifier (ADR 0009 section 4). Duplicate names conflict. Refused for read-only operator sessions; in named operator mode no consent write role exists yet.
      security:
        - operatorBearer: []
        - operatorCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentPurposeInput'}
      responses:
        '201':
          description: Purpose created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsentPurpose'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/operator/consent/policies/{purposeId}:
    parameters:
      - name: purposeId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ID'}
    get:
      operationId: listConsentPolicyVersions
      description: List every policy version of a purpose in version order.
      security:
        - operatorBearer: []
        - operatorCookie: []
      responses:
        '200':
          description: Policy versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ConsentPolicyVersion'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: draftConsentPolicyVersion
      description: Append a new draft policy version. It never edits an existing version and does not activate itself. Refused for read-only operator sessions.
      security:
        - operatorBearer: []
        - operatorCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentPolicyDraft'}
      responses:
        '201':
          description: Draft version created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsentPolicyVersion'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/operator/consent/policy-versions/{versionId}/state:
    parameters:
      - name: versionId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ID'}
    post:
      operationId: transitionConsentPolicyVersion
      description: Apply a reviewable state change to one policy version. Only draft to active and active to retired are allowed; at most one version per purpose is active, so the active version must be retired before another is activated. Refused for read-only operator sessions.
      security:
        - operatorBearer: []
        - operatorCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              additionalProperties: false
              properties:
                state: {type: string, enum: [active, retired]}
      responses:
        '200':
          description: Version after the transition
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsentPolicyVersion'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/operator/consent/evidence/customer/{profileId}:
    parameters:
      - name: profileId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ID'}
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, minLength: 8, maxLength: 128}
    post:
      operationId: appendCustomerConsentEvidence
      description: Append an immutable operator decision about a customer anchor (a profile linked to a customer identity). Grants need the active policy version; withdrawals, denials and objections are also accepted on retired versions. Idempotent per subject by Idempotency-Key; a replay with a different body is 409. Operator grants never count as customer consent.
      security:
        - operatorBearer: []
        - operatorCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentEvidenceInput'}
      responses:
        '200':
          description: Idempotent replay, no new row
          content: {application/json: {schema: {$ref: '#/components/schemas/ConsentEvidenceCreated'}}}
        '201':
          description: Evidence created
          content: {application/json: {schema: {$ref: '#/components/schemas/ConsentEvidenceCreated'}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/operator/consent/evidence/record/{recordEpoch}:
    parameters:
      - name: recordEpoch
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ID'}
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, minLength: 8, maxLength: 128}
    post:
      operationId: appendRecordConsentEvidence
      description: Append an immutable operator decision about a live source record epoch. It is ordered against link and unlink by the record-epoch lock; evaluation decides which customers it covers from association history.
      security:
        - operatorBearer: []
        - operatorCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentEvidenceInput'}
      responses:
        '200':
          description: Idempotent replay, no new row
          content: {application/json: {schema: {$ref: '#/components/schemas/ConsentEvidenceCreated'}}}
        '201':
          description: Evidence created
          content: {application/json: {schema: {$ref: '#/components/schemas/ConsentEvidenceCreated'}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/operator/consent/effective/{profileId}/{purposeId}:
    parameters:
      - {name: profileId, in: path, required: true, schema: {$ref: '#/components/schemas/ID'}}
      - {name: purposeId, in: path, required: true, schema: {$ref: '#/components/schemas/ID'}}
    get:
      operationId: evaluateCustomerPermission
      description: Deterministic effective permission for a customer anchor and purpose, from committed evidence and association history in one read-only snapshot. Only an authenticated customer grant valid for the active policy version (directly or by carry-forward) permits consent processing. Withdrawals, denials and objections apply across versions and lawful-basis changes; a later customer grant lifts a withdrawal. A source record's withdrawal applies to every customer associated with that record when it was received or later linked, and survives unlinking. Precedence uses database receipt time only. Too much or no applicable evidence fails closed.
      security:
        - operatorBearer: []
        - operatorCookie: []
      responses:
        '200':
          description: Effective evaluation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsentEvaluation'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    linkingIssuerBearer:
      type: http
      scheme: bearer
      description: Dedicated synthetic source authority credential, distinct from source mutation, operator and customer credentials.
    sourceBearer:
      type: http
      scheme: bearer
      description: Development source credential, configured server-side; never a client-provided source name.
    customerSession:
      type: apiKey
      in: header
      name: X-Session-Token
      description: Native Kratos session token verified online against the configured public Kratos endpoint.
    customerBrowserSession:
      type: apiKey
      in: cookie
      name: cf_customer_4433
      description: >-
        Local reference only. Kratos issues an HttpOnly cookie whose numeric suffix
        is the assigned browser port (4433 on the default checkout).
    operatorBearer:
      type: http
      scheme: bearer
      description: >-
        In named operator mode, a native session from the isolated operator Kratos issuer.
        The session must have password and TOTP authentication at AAL2 and explicit profile
        read permission. The earlier local M1 compatibility stack instead uses a development bearer credential.
    operatorCookie:
      type: apiKey
      in: cookie
      name: cf_operator_4435
      description: >-
        Browser session from the named operator issuer with the same assurance and permission
        checks. The cookie name shown uses an example port. The local operator reference
        forwards the cookie for its assigned loopback port with the configured origin.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{16,128}$'}
      description: >-
        Unique within the authenticated source across all mutation routes. Reusing a key
        with different method/path/version/content returns 409. Successful responses and
        ownership rejections are retained without automatic expiry; other failures do not
        reserve the key. Retry an uncertain request unchanged with the same key.
  headers:
    ETag:
      description: Quoted profile version. A replay returns the historical receipt version.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
  responses:
    CustomerProfile:
      description: Customer-facing profile scoped to the authenticated subject
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CustomerProfile'}
    Problem:
      description: >-
        RFC 9457 error. 400 invalid JSON, unknown/case-aliased fields, repeated authentication or mutation headers, query, key or precondition;
        401 unauthorized; 403 verification or credential scope; 404 missing resource; 405 unsupported method; 409 ownership,
        identifier or key conflict; 412 stale version; 413 body over 64 KiB;
        415 non-JSON media type; 422 invalid mutation or profile limit;
        428 missing If-Match; 429 rate limited; 500 storage/server failure; 503 customer identity verification unavailable.
        Errors never disclose database details or customer values.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    ConsentPurposeInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
    ConsentPurpose:
      type: object
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        name: {type: string}
    ConsentEvidenceInput:
      type: object
      additionalProperties: false
      description: The actor is the authenticated operator; the body cannot claim a customer or source actor.
      required: [policy_version_id, decision, occurred_at, proof_channel, proof_reference]
      properties:
        policy_version_id: {$ref: '#/components/schemas/ID'}
        decision: {type: string, enum: [grant, deny, withdraw, object]}
        occurred_at: {type: string, format: date-time}
        proof_channel: {type: string, pattern: '^[a-z][a-z0-9_]{0,31}$'}
        proof_reference: {type: string, minLength: 1, maxLength: 256}
    ConsentEvidenceCreated:
      type: object
      required: [subject_id, evidence_id, created, acknowledgment]
      properties:
        subject_id: {$ref: '#/components/schemas/ID'}
        evidence_id: {$ref: '#/components/schemas/ID'}
        created: {type: boolean}
        acknowledgment:
          type: string
          enum: [pending_journal]
          description: Durable in PostgreSQL, not rollback-safe. No journal exists yet.

    ConsentEvaluation:
      type: object
      required: [outcome, basis, reasons]
      properties:
        outcome: {type: string, enum: [permitted, blocked, blocked_fail_closed]}
        basis: {type: string}
        reasons: {type: array, items: {type: string}}

    ConsentPolicyDraft:
      type: object
      additionalProperties: false
      required: [lawful_basis, notice_reference, jurisdiction, locale, channel, retention_reference]
      properties:
        lawful_basis:
          type: string
          enum: [consent, contract, legal_obligation, vital_interests, public_task, legitimate_interests]
        notice_reference: {type: string, minLength: 1, maxLength: 256}
        jurisdiction: {type: string, pattern: '^[A-Z]{2}$'}
        locale: {type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$'}
        channel: {type: string, pattern: '^[a-z][a-z0-9_]{0,31}$'}
        retention_reference: {type: string, minLength: 1, maxLength: 256}
        carry_forward: {type: boolean, default: false}
    ConsentPolicyVersion:
      type: object
      required: [id, purpose_id, version, state, lawful_basis, notice_reference, jurisdiction, locale, channel, retention_reference, carry_forward, created_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        purpose_id: {$ref: '#/components/schemas/ID'}
        version: {type: integer}
        state: {type: string, enum: [draft, active, retired]}
        lawful_basis: {type: string}
        notice_reference: {type: string}
        jurisdiction: {type: string}
        locale: {type: string}
        channel: {type: string}
        retention_reference: {type: string}
        carry_forward: {type: boolean}
        created_at: {type: string, format: date-time}
    LinkingAttestation:
      type: object
      additionalProperties: false
      required: [namespace, record, customer_subject, proof_method, proof_reference]
      properties:
        namespace: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        record: {type: string, minLength: 1, maxLength: 256, description: Canonical issuer record selector limited to 256 UTF-8 bytes and no control characters.}
        customer_subject: {$ref: '#/components/schemas/ID'}
        proof_method: {const: synthetic_challenge}
        proof_reference: {$ref: '#/components/schemas/ID'}
    LinkingGrantSecret:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
      description: One-time base64url secret. Transport in the request body. Never put it in URLs or logs.
    IssuedLinkingGrant:
      type: object
      additionalProperties: false
      required: [id, grant, expires_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        grant: {$ref: '#/components/schemas/LinkingGrantSecret'}
        expires_at: {type: string, format: date-time}
    VerifiedAssociation:
      type: object
      additionalProperties: false
      required: [id, source, linked_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        source: {type: string}
        linked_at: {type: string, format: date-time}
    AssociationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/VerifiedAssociation'}
        next_cursor: {$ref: '#/components/schemas/ID'}
    CustomerProfile:
      type: object
      additionalProperties: false
      required: [id, version, attributes]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        version: {type: integer, minimum: 1}
        attributes: {$ref: '#/components/schemas/Attributes'}
    ProfilePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, version]
            properties:
              id: {$ref: '#/components/schemas/ID'}
              version: {type: integer, minimum: 1}
        next_cursor: {$ref: '#/components/schemas/ID'}
    ID:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    Attributes:
      type: object
      maxProperties: 100
      propertyNames: {pattern: '^[a-z][a-z0-9_]{0,63}$'}
      additionalProperties:
        type: [string, number, boolean]
      description: Non-null scalars only; each JSON-encoded scalar is limited to 4096 bytes.
    IdentifierInput:
      type: object
      additionalProperties: false
      required: [namespace, value]
      properties:
        namespace: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        value: {type: string, minLength: 1, maxLength: 256, description: Additionally limited to 256 UTF-8 bytes.}
    CreateMutation:
      type: object
      additionalProperties: false
      properties:
        set: {$ref: '#/components/schemas/Attributes'}
        identifiers:
          type: array
          maxItems: 20
          uniqueItems: true
          items: {$ref: '#/components/schemas/IdentifierInput'}
      anyOf:
        - required: [set]
          properties:
            set: {minProperties: 1}
        - required: [identifiers]
          properties:
            identifiers: {minItems: 1}
    Mutation:
      type: object
      additionalProperties: false
      properties:
        set: {$ref: '#/components/schemas/Attributes'}
        remove:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        identifiers:
          type: array
          maxItems: 20
          uniqueItems: true
          items: {$ref: '#/components/schemas/IdentifierInput'}
      anyOf:
        - required: [set]
          properties:
            set: {minProperties: 1}
        - required: [remove]
          properties:
            remove: {minItems: 1}
        - required: [identifiers]
          properties:
            identifiers: {minItems: 1}
    Receipt:
      type: object
      additionalProperties: false
      required: [id, version, mutation_id]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        version: {type: integer, minimum: 1}
        mutation_id: {$ref: '#/components/schemas/ID'}
    Profile:
      type: object
      required: [id, version, attributes, identifiers, provenance, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        version: {type: integer, minimum: 1}
        attributes: {$ref: '#/components/schemas/Attributes'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        identifiers:
          type: array
          items:
            type: object
            required: [source, namespace, value]
            properties:
              source: {type: string}
              namespace: {type: string}
              value: {type: string}
        provenance:
          type: array
          maxItems: 100
          items:
            type: object
            required: [path, source, mutation_id, at, outcome, rule]
            properties:
              path: {type: string, description: Top-level attribute key}
              source: {type: string}
              mutation_id: {$ref: '#/components/schemas/ID'}
              at: {type: string, format: date-time}
              outcome: {enum: [accepted, rejected]}
              rule: {const: first-writer-owns}
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: {const: 'about:blank'}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
