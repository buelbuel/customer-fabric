  /v1/operator/notification-subscriptions/{name}/recoveries:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}}
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, pattern: '^[A-Za-z0-9_-]{16,128}$'}
    post:
      operationId: requestNotificationRecovery
      description: >-
        Queue, for this active subscription, the notifications the interrupted subscription it replaced suppressed because its policy
        version no longer authorized them (ADR 0016). Needs the privacy_admin role. Idempotent per key (200 returns the original);
        an event is queued at most once per subscription across requests. Per record only the newest change is queued; older ones,
        and ones older than a change this subscription already delivered, are superseded. A change whose outbox reference is gone,
        or suppressed more than 30 days ago, is unrecoverable. At most 10,000 events per request; more_pending says a request with a
        new key has more. Queuing sends nothing by itself: the Temporal recovery workers send each item, authorized again from
        current state (policy version, consent, objections, restriction, lifecycle, scope and destination) before every attempt, and
        record its outcome once. A subscription that did not replace an interrupted one, or is not active, is 409.
      security:
        - operatorBearer: []
        - operatorCookie: []
      responses:
        '200':
          description: The original request
          content: {application/json: {schema: {$ref: '#/components/schemas/NotificationRecovery'}}}
        '201':
          description: The request
          content: {application/json: {schema: {$ref: '#/components/schemas/NotificationRecovery'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '405': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/operator/notification-subscriptions/{name}/recoveries/{recoveryId}:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}}
      - {name: recoveryId, in: path, required: true, schema: {$ref: '#/components/schemas/ID'}}
    get:
      operationId: getNotificationRecovery
      description: A recovery request with its items counted by state and the recorded outcomes of the started ones.
      security:
        - operatorBearer: []
        - operatorCookie: []
      responses:
        '200':
          description: The request
          content: {application/json: {schema: {$ref: '#/components/schemas/NotificationRecovery'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '405': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/operator/notification-subscriptions/{name}/recoveries/{recoveryId}/items:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}}
      - {name: recoveryId, in: path, required: true, schema: {$ref: '#/components/schemas/ID'}}
      - {name: after, in: query, schema: {$ref: '#/components/schemas/ID'}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
    get:
      operationId: listNotificationRecoveryItems
      description: >-
        A recovery's events in event ID order, after the given event ID: references, state (queued, started, superseded or
        unrecoverable, with a reason) and, once recorded, the outcome and its reason. next is set when a further page may exist.
      security:
        - operatorBearer: []
        - operatorCookie: []
      responses:
        '200':
          description: Items
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  next: {$ref: '#/components/schemas/ID'}
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [event_id, profile_id, profile_version, state]
                      properties:
                        event_id: {$ref: '#/components/schemas/ID'}
                        profile_id: {$ref: '#/components/schemas/ID'}
                        profile_version: {type: integer, minimum: 1}
                        state: {type: string, enum: [queued, started, superseded, unrecoverable]}
                        reason: {type: string, pattern: '^[a-z_0-9]{1,64}$'}
                        started_at: {type: string, format: date-time}
                        outcome: {type: string, enum: [delivered, suppressed, failed]}
                        outcome_reason: {type: string, pattern: '^[a-z_0-9]{1,64}$'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '405': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/operator/consent/purposes:
    post:
      operationId: createConsentPurpose
      description: Register a stable consent-purpose identifier (ADR 0009 section 4). Duplicate names conflict. Refused for read-only operator sessions; in named operator mode no consent write role exists yet.
      security:
        - operatorBearer: []
        - operatorCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentPurposeInput'}
      responses:
        '201':
          description: Purpose created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsentPurpose'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/operator/consent/policies/{purposeId}:
    parameters:
      - name: purposeId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ID'}
    get:
      operationId: listConsentPolicyVersions
      description: List every policy version of a purpose in version order.
      security:
        - operatorBearer: []
        - operatorCookie: []
      responses:
        '200':
          description: Policy versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ConsentPolicyVersion'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      operationId: draftConsentPolicyVersion
      description: Append a new draft policy version. It never edits an existing version and does not activate itself. Refused for read-only operator sessions.
      security:
        - operatorBearer: []
        - operatorCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentPolicyDraft'}
      responses:
        '201':
          description: Draft version created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsentPolicyVersion'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/operator/consent/policy-versions/{versionId}/state:
    parameters:
      - name: versionId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ID'}
    post:
      operationId: transitionConsentPolicyVersion
      description: >-
        Apply a reviewable state change to one policy version. Only draft to active and active to retired are allowed; at most one
        version per purpose is active, so the active version must be retired before another is activated. Refused for read-only
        operator sessions. Retiring a version interrupts every active notification subscription approved under it (ADR 0016): it
        then needs reapproval, and its notifications are suppressed until then. When it interrupts any, acknowledged_impact must be
        the acknowledgment the version's impact returned for exactly those subscriptions; a missing or stale one is 409. Activating
        restores no subscription.
      security:
        - operatorBearer: []
        - operatorCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              additionalProperties: false
              properties:
                state: {type: string, enum: [active, retired]}
                acknowledged_impact: {type: string, pattern: '^[0-9a-f]{64}$'}
      responses:
        '200':
          description: Version after the transition
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsentPolicyVersion'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/operator/consent/policy-versions/{versionId}/impact:
    parameters:
      - {name: versionId, in: path, required: true, schema: {$ref: '#/components/schemas/ID'}}
    get:
      operationId: previewPolicyTransitionImpact
      description: >-
        What the version's next transition does to notification subscriptions. Retiring the active version interrupts the active
        subscriptions approved under it (effect interrupted), and the acknowledgment names exactly them. Activating a draft restores
        none; subscriptions that need reapproval are listed with effect remains_interrupted. A retired version has no transition (409).
      security:
        - operatorBearer: []
        - operatorCookie: []
      responses:
        '200':
          description: The impact
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [policy_version_id, transition, subscriptions]
                properties:
                  policy_version_id: {$ref: '#/components/schemas/ID'}
                  transition: {type: string, enum: [retire, activate]}
                  acknowledgment: {type: string}
                  subscriptions:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [name, destination, recipient_role, event_types, sources, effect]
                      properties:
                        name: {type: string}
                        destination: {type: string}
                        recipient_role: {type: string, enum: [controller, processor]}
                        event_types: {type: array, items: {type: string}}
                        sources: {type: array, items: {type: string}}
                        effect: {type: string, enum: [interrupted, remains_interrupted]}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '405': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/operator/consent/evidence/customer/{profileId}:
    parameters:
      - name: profileId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ID'}
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, minLength: 8, maxLength: 128}
    post:
      operationId: appendCustomerConsentEvidence
      description: Append an immutable operator decision about a customer anchor (a profile linked to a customer identity). Grants need the active policy version; withdrawals, denials and objections are also accepted on retired versions. Idempotent per subject by Idempotency-Key; a replay with a different body is 409. Operator grants never count as customer consent.
      security:
        - operatorBearer: []
        - operatorCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentEvidenceInput'}
      responses:
        '200':
          description: Idempotent replay, no new row
          content: {application/json: {schema: {$ref: '#/components/schemas/ConsentEvidenceCreated'}}}
        '201':
          description: Evidence created
          content: {application/json: {schema: {$ref: '#/components/schemas/ConsentEvidenceCreated'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/operator/consent/evidence/record/{recordEpoch}:
    parameters:
      - name: recordEpoch
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ID'}
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, minLength: 8, maxLength: 128}
    post:
      operationId: appendRecordConsentEvidence
      description: Append an immutable operator decision about a live source record epoch. It is ordered against link and unlink by the record-epoch lock; evaluation decides which customers it covers from association history.
      security:
        - operatorBearer: []
        - operatorCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentEvidenceInput'}
      responses:
        '200':
          description: Idempotent replay, no new row
          content: {application/json: {schema: {$ref: '#/components/schemas/ConsentEvidenceCreated'}}}
        '201':
          description: Evidence created
          content: {application/json: {schema: {$ref: '#/components/schemas/ConsentEvidenceCreated'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/operator/consent/effective/{profileId}/{purposeId}:
    parameters:
      - {name: profileId, in: path, required: true, schema: {$ref: '#/components/schemas/ID'}}
      - {name: purposeId, in: path, required: true, schema: {$ref: '#/components/schemas/ID'}}
    get:
      operationId: evaluateCustomerPermission
      description: Deterministic effective permission for a customer anchor and purpose, from committed evidence and association history in one read-only snapshot. Only an authenticated customer grant valid for the active policy version (directly or by carry-forward) permits consent processing. Withdrawals, denials and objections apply across versions and lawful-basis changes; a later customer grant lifts a withdrawal. A source record's withdrawal applies to every customer associated with that record when it was received or later linked, and survives unlinking. Precedence uses database receipt time only. Too much or no applicable evidence fails closed.
      security:
        - operatorBearer: []
        - operatorCookie: []
      responses:
        '200':
          description: Effective evaluation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsentEvaluation'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    applicationAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A Hydra-issued access token (ADR 0012) for the customer, audience customer-fabric-api, verified against the issuer's JWKS.
        Each operation names the scope it needs. Tokens stay valid until they expire, even after the customer logs out.
    linkingIssuerBearer:
      type: http
      scheme: bearer
      description: Dedicated synthetic source authority credential, distinct from source mutation, operator and customer credentials.
    sourceBearer:
      type: http
      scheme: bearer
      description: Development source credential, configured server-side; never a client-provided source name.
    customerSession:
      type: apiKey
      in: header
      name: X-Session-Token
      description: Native Kratos session token verified online against the configured public Kratos endpoint. A native request must carry no cookie.
    customerBrowserSession:
      type: apiKey
      in: cookie
      name: cf_customer_4433
      description: >-
        Local reference only. Kratos issues an HttpOnly cookie whose numeric suffix
        is the assigned browser port (4433 on the default checkout). A request carries this
        cookie or X-Session-Token, never both. Writes need the exact browser Origin, a
        Sec-Fetch-Site of same-origin when present, and application/json on any body.
    operatorBearer:
      type: http
      scheme: bearer
      description: >-
        In named operator mode, a native session from the isolated operator Kratos issuer.
        The session must have password and TOTP authentication at AAL2 and explicit profile
        read permission. The earlier local M1 compatibility stack instead uses a development bearer credential.
    operatorCookie:
      type: apiKey
      in: cookie
      name: cf_operator_4435
      description: >-
        Browser session from the named operator issuer with the same assurance and permission
        checks. The cookie name shown uses an example port. The local operator reference
        forwards the cookie for its assigned loopback port with the configured origin.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{16,128}$'}
      description: >-
        Unique within the authenticated source across all mutation routes. Reusing a key
        with different method/path/version/content returns 409. Successful responses and
        ownership rejections are retained without automatic expiry; other failures do not
        reserve the key. Retry an uncertain request unchanged with the same key.
  headers:
    ETag:
      description: Quoted profile version. A replay returns the historical receipt version.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
  responses:
    CustomerProfile:
      description: Customer-facing profile scoped to the authenticated subject
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CustomerProfile'}
    Problem:
      description: >-
        RFC 9457 error. 400 invalid JSON, unknown/case-aliased fields, repeated authentication or mutation headers, query, key or precondition;
        401 unauthorized; 403 verification or credential scope; 404 missing resource; 405 unsupported method; 409 ownership,
        identifier or key conflict; 412 stale version or consent revision; 413 body over 64 KiB;
        415 non-JSON media type; 422 invalid mutation or profile limit;
        428 missing If-Match; 429 rate limited; 500 storage/server failure; 503 customer identity verification unavailable.
        Errors never disclose database details or customer values.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    SourceEvent:
      type: object
      additionalProperties: false
      required: [event_id, type, record, source_epoch, sequence, occurred_at]
      description: One change to a source's own record. The credential determines the source. Supply set, remove or both. Use remove to delete an attribute; null is rejected.
      properties:
        event_id: {type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$', description: Immutable and unique within the source.}
        type: {const: record.updated.v1}
        record:
          type: object
          additionalProperties: false
          required: [namespace, value]
          properties:
            namespace: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
            value: {type: string, minLength: 1, maxLength: 256, description: Additionally limited to 256 UTF-8 bytes.}
        source_epoch: {type: integer, format: int64, minimum: 1, description: The source's current epoch. Starts at 1.}
        sequence: {type: integer, format: int64, minimum: 1, description: Increases per record within an epoch. Gaps are allowed.}
        occurred_at: {type: string, format: date-time, description: Recorded for audit. It never affects ordering.}
        set: {$ref: '#/components/schemas/Attributes'}
        remove:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
      anyOf:
        - required: [set]
          properties:
            set: {minProperties: 1}
        - required: [remove]
          properties:
            remove: {minItems: 1}
    AttributeType:
      type: string
      enum: [string, integer, decimal, boolean, date, timestamp, enum]
      description: >-
        Every type stores a JSON scalar. integer is an integer literal within ±(2^53-1); decimal is any JSON number;
        date is a YYYY-MM-DD string; timestamp is an RFC 3339 string with an offset; enum is one of values.
        Dates and timestamps are limited to years 1 to 9999.
    AttributeDefinitionRequest:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {$ref: '#/components/schemas/AttributeType'}
        max_length: {type: integer, minimum: 1, maximum: 4096, description: Characters; strings only.}
        values:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 64}
          description: Required for an enum and allowed only for an enum.
    AttributeDefinition:
      type: object
      additionalProperties: false
      required: [path, revision, type, created_at]
      properties:
        path: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        revision: {type: integer, minimum: 1}
        type: {$ref: '#/components/schemas/AttributeType'}
        max_length: {type: integer, minimum: 1, maximum: 4096}
        values: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
    AttributeDefinitionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AttributeDefinition'}}
    AttributeReader:
      type: string
      enum: [operator, segmentation, activation, matching]
      description: >-
        A use of governed values: the operator unified view, segment evaluation, activation payloads, or identity-match candidates. Customers are not a reader;
        customer access to source attributes needs its own authorization decision.
    AccessPolicyRequest:
      type: object
      additionalProperties: false
      required: [readers, sources]
      properties:
        readers: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/AttributeReader'}}
        sources: {type: array, uniqueItems: true, maxItems: 20, items: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}}
    AccessPolicy:
      type: object
      additionalProperties: false
      required: [path, revision, readers, sources, created_at]
      properties:
        path: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        revision: {type: integer, minimum: 1}
        readers: {type: array, items: {$ref: '#/components/schemas/AttributeReader'}}
        sources: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
    AccessPolicyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AccessPolicy'}}
    SegmentCondition:
      type: object
      additionalProperties: false
      required: [attribute, operator]
      description: >-
        For the visible values V of the attribute (after the optional source filter): missing matches when V is empty and present
        when it is not; neq and not_in match when V is non-empty and every value passes, so a missing value never satisfies a
        negative comparison and a conflicting source is never ignored; every other operator matches when some value passes.
        Numbers compare exactly, dates as calendar dates, timestamps as instants, strings and enums byte for byte with no locale
        folding. in and not_in apply to string, enum and integer; gt, gte, lt and lte to integer, decimal, date and timestamp;
        within_last_days (a closed window ending at evaluation time, by UTC calendar date for dates) to date and timestamp.
      properties:
        attribute: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        operator: {type: string, enum: [eq, neq, in, not_in, gt, gte, lt, lte, present, missing, within_last_days]}
        value: {description: 'A literal valid for the attribute. Required by eq, neq, gt, gte, lt and lte only.'}
        values: {type: array, minItems: 1, maxItems: 100, description: Literals; required by in and not_in only.}
        days: {type: integer, minimum: 1, maximum: 36500, description: Required by within_last_days only.}
        sources:
          type: array
          maxItems: 20
          uniqueItems: true
          items: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
          description: Count only values owned by these sources.
    SegmentRule:
      type: object
      additionalProperties: false
      required: [purpose_id, match, conditions]
      properties:
        purpose_id: {$ref: '#/components/schemas/ID'}
        match: {type: string, enum: [all, any]}
        conditions: {type: array, minItems: 1, maxItems: 20, items: {$ref: '#/components/schemas/SegmentCondition'}}
    Segment:
      type: object
      additionalProperties: false
      required: [name, revision, rule, created_at]
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        revision: {type: integer, minimum: 1}
        rule: {$ref: '#/components/schemas/SegmentRule'}
        created_at: {type: string, format: date-time}
    SegmentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Segment'}}
    SegmentEvidence:
      type: object
      additionalProperties: false
      required: [source, association_id, record_profile_id, mutation_id]
      properties:
        source: {type: string}
        association_id: {$ref: '#/components/schemas/ID'}
        record_profile_id: {$ref: '#/components/schemas/ID'}
        mutation_id: {$ref: '#/components/schemas/ID'}
        attribute_revision: {type: integer, minimum: 1}
    SegmentMember:
      type: object
      additionalProperties: false
      required: [anchor_profile_id, consent, conditions]
      properties:
        anchor_profile_id: {$ref: '#/components/schemas/ID'}
        consent: {$ref: '#/components/schemas/ConsentEvaluation'}
        conditions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [index, attribute, operator, matched, evidence]
            properties:
              index: {type: integer, minimum: 0}
              attribute: {type: string}
              operator: {type: string}
              matched: {type: boolean}
              evidence: {type: array, items: {$ref: '#/components/schemas/SegmentEvidence'}}
    SegmentPreview:
      type: object
      additionalProperties: false
      required: [segment, revision, purpose_id, logic, evaluated_at, population, members, excluded, sample, duration_ms]
      properties:
        segment: {type: string}
        revision: {type: integer, minimum: 1}
        purpose_id: {$ref: '#/components/schemas/ID'}
        logic: {type: string}
        evaluated_at: {type: string, format: date-time}
        population: {type: integer, minimum: 0, description: Customer anchors evaluated.}
        members: {type: integer, minimum: 0}
        excluded:
          type: object
          additionalProperties: false
          required: [unavailable, consent, criteria]
          description: Non-members by the first gate they failed.
          properties:
            unavailable: {type: integer, minimum: 0, description: Segmentation view unavailable (lifecycle or size).}
            consent: {type: integer, minimum: 0, description: Effective permission is not permitted.}
            criteria: {type: integer, minimum: 0}
        sample: {type: array, items: {$ref: '#/components/schemas/SegmentMember'}}
        next_cursor: {$ref: '#/components/schemas/ID'}
        duration_ms: {type: integer, minimum: 0, description: How long the evaluation took.}
    Destination:
      type: object
      additionalProperties: false
      required: [name, url, created_at]
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        url: {type: string}
        created_at: {type: string, format: date-time}
        signing_secret: {type: string, pattern: '^[0-9a-f]{64}$', description: Only in the response that created the destination.}
    ActivationSummary:
      type: object
      additionalProperties: false
      required: [id, segment, revision, destination, purpose_id, created_at, population, queued, excluded]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        segment: {type: string}
        revision: {type: integer, minimum: 1}
        destination: {type: string}
        purpose_id: {$ref: '#/components/schemas/ID'}
        created_at: {type: string, format: date-time}
        population: {type: integer, minimum: 0}
        queued: {type: integer, minimum: 0}
        excluded:
          type: object
          additionalProperties: false
          required: [unavailable, consent, criteria]
          properties:
            unavailable: {type: integer, minimum: 0}
            consent: {type: integer, minimum: 0}
            criteria: {type: integer, minimum: 0}
    ActivationStatus:
      type: object
      additionalProperties: false
      required: [id, segment, revision, destination, purpose_id, created_at, counts, deliveries]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        segment: {type: string}
        revision: {type: integer, minimum: 1}
        destination: {type: string}
        purpose_id: {$ref: '#/components/schemas/ID'}
        created_at: {type: string, format: date-time}
        counts:
          type: object
          additionalProperties: false
          required: [pending, delivered, suppressed, failed]
          description: Deliveries per state. Failed deliveries can be redriven.
          properties:
            pending: {type: integer, minimum: 0}
            delivered: {type: integer, minimum: 0}
            suppressed: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
        next_cursor: {$ref: '#/components/schemas/ID'}
        deliveries:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, anchor_profile_id, state, attempts, redrives, updated_at, receipts]
            properties:
              id: {$ref: '#/components/schemas/ID'}
              anchor_profile_id: {$ref: '#/components/schemas/ID'}
              state: {type: string, enum: [pending, delivered, suppressed, failed]}
              attempts: {type: integer, minimum: 0}
              redrives: {type: integer, minimum: 0, maximum: 10}
              reason: {type: string}
              updated_at: {type: string, format: date-time}
              receipts:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [attempt, outcome, reason, at]
                  properties:
                    attempt: {type: integer, minimum: 1}
                    outcome: {type: string, enum: [delivered, suppressed, retry, failed]}
                    reason: {type: string}
                    status_code: {type: integer}
                    at: {type: string, format: date-time}
    CSVMapping:
      type: object
      additionalProperties: false
      required: [namespace, record_column, columns]
      description: Explicit CSV column mapping. Unmapped columns are ignored; the record column is never an attribute.
      properties:
        namespace: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        record_column: {type: string, minLength: 1, maxLength: 128}
        columns:
          type: object
          minProperties: 1
          maxProperties: 100
          additionalProperties: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
          description: Column name to attribute name; attribute names are distinct.
    Import:
      type: object
      additionalProperties: false
      required: [id, format, state, checkpoint, applied, created, quarantined, max_errors, created_at, updated_at, quarantine]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        format: {type: string, enum: [ndjson, csv]}
        mapping: {$ref: '#/components/schemas/CSVMapping'}
        state: {type: string, enum: [open, completed, failed]}
        checkpoint: {type: integer, minimum: 0, description: Last committed line; resume at checkpoint + 1.}
        applied: {type: integer, minimum: 0, description: Rows that updated an existing record.}
        created: {type: integer, minimum: 0, description: Rows that created a record.}
        quarantined: {type: integer, minimum: 0}
        max_errors: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        quarantine:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [line, reason]
            properties:
              line: {type: integer, minimum: 1}
              reason: {type: string, pattern: '^[a-z_]{1,64}$'}
    SegmentSnapshot:
      type: object
      additionalProperties: false
      required: [id, segment, revision, purpose_id, taken_at, population, members, excluded]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        segment: {type: string}
        revision: {type: integer, minimum: 1}
        purpose_id: {$ref: '#/components/schemas/ID'}
        taken_at: {type: string, format: date-time}
        population: {type: integer, minimum: 0}
        members: {type: integer, minimum: 0}
        excluded:
          type: object
          additionalProperties: false
          required: [unavailable, consent, criteria]
          properties:
            unavailable: {type: integer, minimum: 0}
            consent: {type: integer, minimum: 0}
            criteria: {type: integer, minimum: 0}
    AudienceJob:
      type: object
      additionalProperties: false
      required: [id, kind, segment, revision, purpose_id, state, attempts, evaluated, members, excluded, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        kind: {type: string, enum: [snapshot, activation]}
        segment: {type: string}
        revision: {type: integer, minimum: 1}
        purpose_id: {$ref: '#/components/schemas/ID'}
        destination: {type: string}
        state: {type: string, enum: [queued, running, completed, failed, cancelled]}
        reason: {type: string, pattern: '^[a-z_0-9]{1,64}$'}
        attempts: {type: integer, minimum: 0}
        evaluated: {type: integer, minimum: 0}
        members: {type: integer, minimum: 0}
        excluded:
          type: object
          additionalProperties: false
          required: [unavailable, consent, criteria]
          properties:
            unavailable: {type: integer, minimum: 0}
            consent: {type: integer, minimum: 0}
            criteria: {type: integer, minimum: 0}
        evaluated_at: {type: string, format: date-time}
        snapshot_id: {$ref: '#/components/schemas/ID'}
        activation_id: {$ref: '#/components/schemas/ID'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
    Restriction:
      type: object
      additionalProperties: false
      required: [profile_id, restricted, decisions]
      properties:
        profile_id: {$ref: '#/components/schemas/ID'}
        restricted: {type: boolean}
        decisions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, action, reason, actor, decided_at]
            properties:
              id: {$ref: '#/components/schemas/ID'}
              action: {type: string, enum: [restrict, lift]}
              reason: {type: string}
              review_by: {type: string, format: date}
              actor: {type: string}
              decided_at: {type: string, format: date-time}
    ConsentAuthority:
      type: object
      additionalProperties: false
      required: [id, source, purpose_id, controller, collection_methods, state, approved_by, approved_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        source: {type: string}
        purpose_id: {$ref: '#/components/schemas/ID'}
        controller: {type: string}
        collection_methods: {type: array, items: {type: string}}
        state: {type: string, enum: [active, revoked]}
        approved_by: {type: string}
        approved_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        revoked_by: {type: string}
    NotificationSubscription:
      type: object
      additionalProperties: false
      required: [name, destination, purpose_id, policy_version_id, recipient_role, event_types, data_categories, sources, state, created_by, created_at, updated_at]
      properties:
        name: {type: string}
        destination: {type: string}
        purpose_id: {$ref: '#/components/schemas/ID'}
        policy_version_id: {$ref: '#/components/schemas/ID'}
        basis_assessment: {type: string}
        recipient_role: {type: string, enum: [controller, processor]}
        event_types: {type: array, items: {type: string}}
        data_categories: {type: array, items: {type: string}}
        sources: {type: array, items: {type: string}}
        state: {type: string, enum: [active, suspended, needs_reapproval, superseded]}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        replaces: {type: string}
        replaced_by: {type: string}
        interruption:
          type: object
          additionalProperties: false
          required: [since, suppressed]
          description: Set once a policy change interrupted the subscription; until is when its replacement was approved.
          properties:
            since: {type: string, format: date-time}
            until: {type: string, format: date-time}
            suppressed: {type: integer, minimum: 0}
    NotificationRecovery:
      type: object
      additionalProperties: false
      required: [id, subscription, requested_by, requested_at, more_pending, items, outcomes]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        subscription: {type: string}
        requested_by: {type: string}
        requested_at: {type: string, format: date-time}
        more_pending: {type: boolean}
        items:
          type: object
          additionalProperties: false
          required: [queued, started, superseded, unrecoverable]
          properties:
            queued: {type: integer, minimum: 0}
            started: {type: integer, minimum: 0}
            superseded: {type: integer, minimum: 0}
            unrecoverable: {type: integer, minimum: 0}
        outcomes:
          type: object
          additionalProperties: false
          properties:
            delivered: {type: integer, minimum: 0}
            suppressed: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
    MatchReview:
      type: object
      additionalProperties: false
      required: [id, profile_id, candidate_profile_id, decision, class, agree, disagree, reviewed_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        profile_id: {$ref: '#/components/schemas/ID'}
        candidate_profile_id: {$ref: '#/components/schemas/ID'}
        decision: {type: string, enum: [same_person, different_people]}
        class: {type: string, enum: [strong, probable, conflicting]}
        agree: {type: array, items: {type: string}}
        disagree: {type: array, items: {type: string}}
        reviewed_at: {type: string, format: date-time}
    CustomerPreferences:
      type: object
      additionalProperties: false
      required: [display_name, preferred_language, timezone, version, changes]
      properties:
        display_name: {type: [string, 'null']}
        preferred_language: {type: [string, 'null']}
        timezone: {type: [string, 'null']}
        version: {type: integer, minimum: 0}
        updated_at: {type: string, format: date-time}
        changes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [version, fields, changed_at]
            properties:
              version: {type: integer, minimum: 1}
              fields: {type: array, items: {type: string, enum: [display_name, preferred_language, timezone]}}
              changed_at: {type: string, format: date-time}
    Application:
      type: object
      additionalProperties: false
      required: [client_id, name, type, redirect_uris, scopes, created_at]
      properties:
        client_id: {type: string}
        name: {type: string}
        type: {type: string, enum: [public, confidential]}
        redirect_uris: {type: array, items: {type: string}}
        scopes: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        client_secret: {type: string, description: Returned once, when a confidential application is registered.}
    SourceEpoch:
      type: object
      additionalProperties: false
      required: [source, epoch]
      properties:
        source: {type: string}
        epoch: {type: integer, minimum: 1}
    SourceEventReceipt:
      type: object
      additionalProperties: false
      required: [event_id, outcome, profile_id]
      properties:
        event_id: {type: string}
        outcome: {type: string, enum: [applied, stale, conflict]}
        profile_id: {$ref: '#/components/schemas/ID'}
        profile_version: {type: integer, minimum: 1, description: Present only when applied.}
        mutation_id: {$ref: '#/components/schemas/ID', description: Links to the profile's provenance. Absent when stale.}
    ConsentPurposeInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
    ConsentPurpose:
      type: object
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        name: {type: string}
    ConsentEvidenceInput:
      type: object
      additionalProperties: false
      description: The actor is the authenticated operator; the body cannot claim a customer or source actor.
      required: [policy_version_id, decision, occurred_at, proof_channel, proof_reference]
      properties:
        policy_version_id: {$ref: '#/components/schemas/ID'}
        decision: {type: string, enum: [grant, deny, withdraw, object]}
        occurred_at: {type: string, format: date-time}
        proof_channel: {type: string, pattern: '^[a-z][a-z0-9_]{0,31}$'}
        proof_reference: {type: string, minLength: 1, maxLength: 256}
    ConsentEvidenceCreated:
      type: object
      required: [subject_id, evidence_id, created, acknowledgment]
      properties:
        subject_id: {$ref: '#/components/schemas/ID'}
        evidence_id: {$ref: '#/components/schemas/ID'}
        created: {type: boolean}
        acknowledgment:
          type: string
          enum: [pending_journal]
          description: Durable in PostgreSQL, not rollback-safe. No journal exists yet.

    ConsentEvaluation:
      type: object
      required: [outcome, basis, reasons]
      properties:
        outcome: {type: string, enum: [permitted, blocked, blocked_fail_closed]}
        basis: {type: string}
        reasons: {type: array, items: {type: string}}

    CustomerConsentDecision:
      type: object
      additionalProperties: false
      description: The session is the actor; the body cannot claim a subject, actor, channel or time.
      required: [policy_version_id, decision]
      properties:
        policy_version_id: {$ref: '#/components/schemas/ID'}
        decision: {type: string, enum: [grant, withdraw]}
    CustomerConsentPolicy:
      type: object
      additionalProperties: false
      required: [id, version, state, lawful_basis, explanation, notice_reference, jurisdiction, locale, channel, retention_reference]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        version: {type: integer, minimum: 1, description: The version whose explanation the customer is deciding on.}
        state: {type: string, enum: [active, retired]}
        lawful_basis: {type: string}
        explanation: {type: string, description: Plain text from the controller. Render it as text.}
        notice_reference: {type: string}
        jurisdiction: {type: string}
        locale: {type: string}
        channel: {type: string}
        retention_reference: {type: string}
    CustomerConsent:
      type: object
      additionalProperties: false
      required: [purpose_id, purpose_name, policy, effective, revision, available_decisions]
      properties:
        purpose_id: {$ref: '#/components/schemas/ID'}
        purpose_name: {type: string}
        policy: {$ref: '#/components/schemas/CustomerConsentPolicy'}
        effective: {$ref: '#/components/schemas/ConsentEvaluation'}
        revision: {type: integer, minimum: 1, description: Quote this in If-Match when granting.}
        latest_decision: {type: string, enum: [grant, deny, withdraw, object]}
        latest_decision_at: {type: string, format: date-time}
        available_decisions:
          type: array
          description: Empty when the purpose rests on another lawful basis, so there is no consent choice.
          items: {type: string, enum: [grant, withdraw]}
    CustomerConsentPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CustomerConsent'}
        next_cursor: {$ref: '#/components/schemas/ID'}
    CustomerConsentHistoryPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, purpose_id, purpose_name, policy_version_id, policy_version, decision, actor_kind, received_at]
            properties:
              id: {$ref: '#/components/schemas/ID'}
              purpose_id: {$ref: '#/components/schemas/ID'}
              purpose_name: {type: string}
              policy_version_id: {$ref: '#/components/schemas/ID'}
              policy_version: {type: integer, minimum: 1}
              decision: {type: string, enum: [grant, deny, withdraw, object]}
              actor_kind: {type: string, enum: [customer, source, operator]}
              received_at: {type: string, format: date-time}
        next_cursor: {$ref: '#/components/schemas/ID'}
    ConsentPolicyDraft:
      type: object
      additionalProperties: false
      required: [lawful_basis, notice_reference, explanation, jurisdiction, locale, channel, retention_reference]
      properties:
        lawful_basis:
          type: string
          enum: [consent, contract, legal_obligation, vital_interests, public_task, legitimate_interests]
        notice_reference: {type: string, minLength: 1, maxLength: 256}
        explanation: {type: string, minLength: 1, maxLength: 2048, description: Plain text shown to customers with this version. Limited to 2048 UTF-8 bytes and never only whitespace.}
        jurisdiction: {type: string, pattern: '^[A-Z]{2}$'}
        locale: {type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$'}
        channel: {type: string, pattern: '^[a-z][a-z0-9_]{0,31}$'}
        retention_reference: {type: string, minLength: 1, maxLength: 256}
        carry_forward: {type: boolean, default: false}
    ConsentPolicyVersion:
      type: object
      required: [id, purpose_id, version, state, lawful_basis, notice_reference, explanation, jurisdiction, locale, channel, retention_reference, carry_forward, created_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        purpose_id: {$ref: '#/components/schemas/ID'}
        version: {type: integer}
        state: {type: string, enum: [draft, active, retired]}
        lawful_basis: {type: string}
        notice_reference: {type: string}
        explanation: {type: string}
        jurisdiction: {type: string}
        locale: {type: string}
        channel: {type: string}
        retention_reference: {type: string}
        carry_forward: {type: boolean}
        created_at: {type: string, format: date-time}
    LinkingAttestation:
      type: object
      additionalProperties: false
      required: [namespace, record, customer_subject, proof_method, proof_reference]
      properties:
        namespace: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        record: {type: string, minLength: 1, maxLength: 256, description: Canonical issuer record selector limited to 256 UTF-8 bytes and no control characters.}
        customer_subject: {$ref: '#/components/schemas/ID'}
        proof_method: {const: synthetic_challenge}
        proof_reference: {$ref: '#/components/schemas/ID'}
    LinkingGrantSecret:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
      description: One-time base64url secret. Transport in the request body. Never put it in URLs or logs.
    IssuedLinkingGrant:
      type: object
      additionalProperties: false
      required: [id, grant, expires_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        grant: {$ref: '#/components/schemas/LinkingGrantSecret'}
        expires_at: {type: string, format: date-time}
    VerifiedAssociation:
      type: object
      additionalProperties: false
      required: [id, source, linked_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        source: {type: string}
        linked_at: {type: string, format: date-time}
    AssociationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/VerifiedAssociation'}
        next_cursor: {$ref: '#/components/schemas/ID'}
    CustomerProfile:
      type: object
      additionalProperties: false
      required: [id, version, attributes]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        version: {type: integer, minimum: 1}
        attributes: {$ref: '#/components/schemas/Attributes'}
    ProfilePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, version]
            properties:
              id: {$ref: '#/components/schemas/ID'}
              version: {type: integer, minimum: 1}
        next_cursor: {$ref: '#/components/schemas/ID'}
    ID:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    Attributes:
      type: object
      maxProperties: 100
      propertyNames: {pattern: '^[a-z][a-z0-9_]{0,63}$'}
      additionalProperties:
        type: [string, number, boolean]
      description: Non-null scalars only; each JSON-encoded scalar is limited to 4096 bytes.
    IdentifierInput:
      type: object
      additionalProperties: false
      required: [namespace, value]
      properties:
        namespace: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        value: {type: string, minLength: 1, maxLength: 256, description: Additionally limited to 256 UTF-8 bytes.}
    CreateMutation:
      type: object
      additionalProperties: false
      properties:
        set: {$ref: '#/components/schemas/Attributes'}
        identifiers:
          type: array
          maxItems: 20
          uniqueItems: true
          items: {$ref: '#/components/schemas/IdentifierInput'}
      anyOf:
        - required: [set]
          properties:
            set: {minProperties: 1}
        - required: [identifiers]
          properties:
            identifiers: {minItems: 1}
    Mutation:
      type: object
      additionalProperties: false
      properties:
        set: {$ref: '#/components/schemas/Attributes'}
        remove:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        identifiers:
          type: array
          maxItems: 20
          uniqueItems: true
          items: {$ref: '#/components/schemas/IdentifierInput'}
      anyOf:
        - required: [set]
          properties:
            set: {minProperties: 1}
        - required: [remove]
          properties:
            remove: {minItems: 1}
        - required: [identifiers]
          properties:
            identifiers: {minItems: 1}
    Receipt:
      type: object
      additionalProperties: false
      required: [id, version, mutation_id]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        version: {type: integer, minimum: 1}
        mutation_id: {$ref: '#/components/schemas/ID'}
    CustomerUnifiedView:
      type: object
      additionalProperties: false
      required: [anchor_profile_id, logic, reader, attributes, records]
      properties:
        anchor_profile_id: {$ref: '#/components/schemas/ID'}
        logic: {type: string, enum: [governed-verified-records-multi-value-v2]}
        reader: {$ref: '#/components/schemas/AttributeReader'}
        attributes:
          type: array
          items: {$ref: '#/components/schemas/CustomerViewAttribute'}
        records:
          type: array
          items: {$ref: '#/components/schemas/CustomerViewRecord'}
    CustomerViewAttribute:
      type: object
      additionalProperties: false
      required: [path, type, definition_revision, policy_revision, conflict, values]
      properties:
        path: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        type: {$ref: '#/components/schemas/AttributeType'}
        definition_revision: {type: integer, minimum: 1, description: Current definition revision.}
        policy_revision: {type: integer, minimum: 1, description: Access policy revision that allowed the disclosure.}
        conflict: {type: boolean, description: True when the disclosed values differ. No value is preferred.}
        values:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [value, source, association_id, record_profile_id, mutation_id, written_at]
            properties:
              value: {type: [string, number, boolean]}
              source: {type: string}
              association_id: {$ref: '#/components/schemas/ID'}
              record_profile_id: {$ref: '#/components/schemas/ID'}
              mutation_id: {$ref: '#/components/schemas/ID'}
              written_at: {type: string, format: date-time}
              attribute_revision: {type: integer, minimum: 1, description: Definition revision the value was validated under. Absent for a value written before the attribute was defined.}
    CustomerViewRecord:
      type: object
      additionalProperties: false
      description: >-
        One active association. Status included contributes values. Status restricted (restricted profile or non-active record lifecycle), not_source_owned or
        multiple_identifiers contributes none and carries only its association metadata.
      required: [association_id, source, linked_at, status, withheld_attributes]
      properties:
        association_id: {$ref: '#/components/schemas/ID'}
        source: {type: string}
        linked_at: {type: string, format: date-time}
        status: {type: string, enum: [included, restricted, not_source_owned, multiple_identifiers]}
        record_profile_id: {$ref: '#/components/schemas/ID'}
        profile_version: {type: integer, minimum: 1}
        updated_at: {type: string, format: date-time}
        withheld_attributes: {type: integer, minimum: 0, description: Attributes of an included record that this view may not disclose.}
    Profile:
      type: object
      required: [id, version, attributes, identifiers, provenance, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        version: {type: integer, minimum: 1}
        attributes: {$ref: '#/components/schemas/Attributes'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        identifiers:
          type: array
          items:
            type: object
            required: [source, namespace, value]
            properties:
              source: {type: string}
              namespace: {type: string}
              value: {type: string}
        provenance:
          type: array
          maxItems: 100
          items:
            type: object
            required: [path, source, mutation_id, at, outcome, rule]
            properties:
              path: {type: string, description: Top-level attribute key}
              source: {type: string}
              mutation_id: {$ref: '#/components/schemas/ID'}
              at: {type: string, format: date-time}
              outcome: {enum: [accepted, rejected]}
              rule: {const: first-writer-owns}
              attribute_revision: {type: integer, minimum: 1, description: Definition revision an accepted value was validated under. Absent for untyped values, removals and rejections.}
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: {const: 'about:blank'}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
