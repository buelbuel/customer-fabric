      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, minLength: 8, maxLength: 128}
    post:
      operationId: appendCustomerConsentEvidence
      description: Append an immutable operator decision about a customer anchor (a profile linked to a customer identity). Grants need the active policy version; withdrawals, denials and objections are also accepted on retired versions. Idempotent per subject by Idempotency-Key; a replay with a different body is 409. Operator grants never count as customer consent.
      security:
        - operatorBearer: []
        - operatorCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentEvidenceInput'}
      responses:
        '200':
          description: Idempotent replay, no new row
          content: {application/json: {schema: {$ref: '#/components/schemas/ConsentEvidenceCreated'}}}
        '201':
          description: Evidence created
          content: {application/json: {schema: {$ref: '#/components/schemas/ConsentEvidenceCreated'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
