name: CI
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Check generated queries
        run: docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc:1.31.1 diff
      - id: init
        working-directory: .
        run: make init
      - name: Test against the deployment PostgreSQL image
        working-directory: .
        run: |
          docker compose --env-file .env -f deploy/compose.yaml up --build -d --wait db
          docker compose --env-file .env -f deploy/compose.yaml run --rm go go test -race -count=1 ./...
      - name: Validate committed enterprise fixtures
        run: go run ./tests/generator -validate ../tests/fixtures/enterprise/sample
      - run: go vet ./...
      - run: go mod verify
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go build ./cmd/api
      - name: Generate a CycloneDX SBOM for the backend module
        run: go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 mod -licenses -json -output ../sbom-backend.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-backend
          path: sbom-backend.cdx.json
          retention-days: 14
      - if: always() && steps.init.outcome == 'success'
        working-directory: .
        run: docker compose --env-file .env -f deploy/compose.yaml down
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun audit

  customer-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: make m1-linking-init
      - run: make m1-up
      - run: make m1-smoke
      - run: make m1-linking-smoke
      - run: make customer-view-demo
      - run: make source-events-demo
      - run: make m1-contracts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.60.0
      - run: python -m playwright install --with-deps chromium
      - run: make m1-browser
      - run: make m1-session-smoke
      - run: make m1-settings-race
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          retention-days: 14
          name: settings-race-report
          path: .tools/reports/settings-race.json
          include-hidden-files: true
      - run: bash scripts/scan-images.sh --reference
      - name: Report open development identity image findings
        run: bash scripts/scan-images.sh --identity-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          retention-days: 14
          name: development-identity-image-reports
          path: .tools/security/ci-*.json
          include-hidden-files: true
      - if: always()
        run: |
          if [ -f .env ] && [ -f .env.m1 ]; then
            make down
          fi

  contracts-and-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: make init
      - name: Build from fresh dependency layers
        run: docker compose --env-file .env -f deploy/compose.yaml build --no-cache db api migrate admin-production
      - name: Exercise real backend contracts
        run: |
          docker compose --env-file .env -f deploy/compose.yaml up -d api
          docker build --no-cache -f tools/verification/Dockerfile -t fabric-contracts .
          docker compose --env-file .env -f deploy/compose.yaml run --rm contracts sh -c 'bun install --frozen-lockfile && bun contracts.ts && bun fixtures.ts && bun audit'
      - name: Scan runtime and frontend tool images
        run: bash scripts/scan-images.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          retention-days: 14
          name: image-vulnerability-reports
          path: .tools/security/ci-*.json
          include-hidden-files: true
      - if: always()
        run: docker compose --env-file .env -f deploy/compose.yaml down

  operator-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: make operator-up
      - run: make operator-smoke
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install playwright==1.60.0
      - run: python -m playwright install --with-deps chromium
      - run: make operator-browser
      - if: always()
        run: |
          if [ -f .env.operator ]; then make down; fi
