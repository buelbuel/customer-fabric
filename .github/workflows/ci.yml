name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_USER: fabric
          POSTGRES_PASSWORD: ci-only-synthetic-database
          POSTGRES_DB: fabric
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U fabric -d fabric'
          --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://fabric:ci-only-synthetic-database@127.0.0.1:5432/fabric?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)"
      - name: Check generated queries
        run: docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc:1.31.1 diff
      - run: go test -race -count=1 ./...
      - name: Validate committed enterprise fixtures
        run: go run ./tests/generator -validate ../tests/fixtures/enterprise/sample
      - run: go vet ./...
      - run: go mod verify
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go build ./cmd/api
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun audit

  contracts-and-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make init
      - name: Build from fresh dependency layers
        run: docker compose --env-file .env -f deploy/compose.yaml build --no-cache api migrate admin-production
      - name: Exercise real backend contracts
        run: |
          docker compose --env-file .env -f deploy/compose.yaml up -d api
          docker build --no-cache -f tools/verification/Dockerfile -t fabric-contracts .
          docker compose --env-file .env -f deploy/compose.yaml run --rm contracts sh -c 'bun install --frozen-lockfile && bun contracts.ts && bun fixtures.ts && bun audit'
      - name: Scan runtime and frontend tool images
        run: bash scripts/scan-images.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-vulnerability-reports
          path: .tools/security/ci-*.json
      - if: always()
        run: docker compose --env-file .env -f deploy/compose.yaml down
